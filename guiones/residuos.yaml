# Qué pasa con tu basura cuando la tiras
# Canal de ciencias medioambientales · sección «Cómo funciona».
# Temario: Gestión de Residuos Sólidos, temas 1 a 5 (introducción, legislación, prevención,
# residuos urbanos y recogida, reciclado). Ampliado con datos actuales; cada dato lleva su fuente.
# Las escenas que repiten exactamente la misma «escena» (marcadas con & y *) reutilizan la imagen.

canal: medioambiente

descripcion: >-
  En 1953, una empresa química vendió por un dólar un terreno a un colegio. Debajo había 21.000 toneladas de
  residuos tóxicos. En este vídeo seguimos el camino de la basura: qué es un residuo, cuánto generamos, qué
  pasa cuando se gestiona mal (Love Canal y el vertedero de Zaldibar), por qué no generar residuos es mejor
  que reciclarlos, cómo se recogen y se reciclan el papel y el plástico, y qué cambian las nuevas leyes, del
  impuesto al plástico al depósito de 10 céntimos por botella. Todos los datos, con su fuente.
hashtags: "#residuos #reciclaje #basura #economíacircular #medioambiente #España"

carpeta: "Residuos"
titulos:
  - "Vendieron por 1 dólar un terreno lleno de veneno… y construyeron un colegio encima"
  - "Por qué tu botella de plástico probablemente no se recicla"
  - "Qué pasa con tu basura cuando la tiras (y por qué España suspende)"

miniaturas:
  - texto: "¿Dónde acaba?"
    resaltar: "acaba"
    escena: &contenedores >-
      Una calle de un barrio español al atardecer con una fila de contenedores de colores (amarillo, azul,
      verde, marrón y gris) junto a la acera; una bolsa de basura apoyada al lado. Edificios de ladrillo y
      balcones con ropa tendida. Luz cálida.
  - texto: "Colegio sobre veneno"
    resaltar: "veneno"
    lado: izquierda
    escena: &escuela_canal >-
      Un colegio de ladrillo de una planta de los años cincuenta en un barrio de casas de madera de Estados
      Unidos; delante, un campo de hierba con charcos de colores extraños y bidones oxidados asomando de la
      tierra. Cielo gris.
  - texto: "¿Se recicla?"
    resaltar: "recicla"
    escena: &montana_plastico >-
      Una montaña de envases de plástico aplastados (botellas, garrafas, bolsas, bandejas) atados en balas
      dentro de una nave industrial enorme, con una pala mecánica pequeña al pie. Luz fría que entra por
      lucernarios.

