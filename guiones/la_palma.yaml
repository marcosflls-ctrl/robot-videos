# La Palma 2021: cómo funciona un volcán, contado con la erupción de Cumbre Vieja (Tajogaite)
# Canal de ciencias medioambientales · sección «El suceso».
# Temario: Riesgos naturales, tema 3 (riesgo volcánico) y Geología, tema 9 (magmatismo).
# Cada dato lleva su fuente (lista «fuentes»). Las escenas que repiten exactamente la misma
# «escena» (marcadas con & y *) reutilizan la imagen: se paga una sola vez.

canal: medioambiente

titulo: "Cómo funciona un volcán: la erupción de La Palma, explicada"
descripcion: >-
  El 19 de septiembre de 2021 se abrió la tierra en Cumbre Vieja, en la isla de La Palma. Durante 85 días
  el volcán que hoy se conoce como Tajogaite cubrió de lava más de 1.200 hectáreas, destruyó casi 3.000
  construcciones y ganó tierra al mar. Con esta erupción como hilo explicamos cómo funciona un volcán:
  de dónde sale el magma, cómo se detecta una erupción antes de que empiece, por qué unos volcanes explotan
  y otros no, qué peligros trae cada uno y cómo se protege a la población. Todos los datos, con su fuente.
hashtags: "#LaPalma #volcán #Tajogaite #geología #CumbreVieja #ciencia"

miniatura:
  texto: "Así funciona un volcán"
  resaltar: "volcán"
  cifra: "85 días"
  escena: &cono_noche >-
    Un cono volcánico negro en plena erupción de noche, en la cresta de una isla montañosa: varias bocas
    alineadas lanzan fuentes de lava naranja y bombas incandescentes; dos ríos de lava bajan por la ladera
    hacia el valle, donde se ven pequeñas casas blancas y plataneras a oscuras. Cielo negro con una columna
    de gas y ceniza iluminada desde abajo.

