# La hiperinflación alemana de 1923: cuando una barra de pan costaba 201.000 millones de marcos
# Canal de historia económica. Guion para revisar antes de montar.
# Cada dato lleva su fuente (lista «fuentes»). Las escenas que repiten exactamente la misma
# «escena» (marcadas con & y *) reutilizan la imagen: se paga una sola vez.
# Los políticos que salen se nombran, pero nunca se dibujan: las figuras son anónimas.
# Las escenas con «en_short: true» son las que entran en el Short de su capítulo (30–45 segundos).
# Ojo con las cifras: en español, un billón es un millón de millones (lo que en inglés es «trillion»).

descripcion: >-
  En enero de 1923, una barra de pan costaba en Alemania 250 marcos. En noviembre, 201.000 millones. Los
  sueldos se pagaban a mediodía porque por la tarde ya valían la mitad, y había quien quemaba billetes porque
  calentaban más que la leña que se podía comprar con ellos. Esta es la historia de cómo una guerra pagada a
  crédito, unas reparaciones imposibles y una imprenta de billetes sin freno destruyeron una moneda, quién
  ganó, quién lo perdió todo y cómo se acabó en un solo día quitando doce ceros.
hashtags: "#hiperinflación #Alemania #1923 #Weimar #economía #historia"

carpeta: "La hiperinflación alemana (1923)"
titulos:
  - "Una barra de pan por 201.000 millones: el año en que el dinero alemán dejó de valer"
  - "Cobraban a mediodía porque por la tarde su sueldo valía la mitad (Alemania, 1923)"
  - "Cómo se destruye una moneda en un año: la hiperinflación alemana de 1923"

miniaturas:
  - texto: "¿Cuánto por el pan?"
    resaltar: "pan"
    escena: &panaderia >-
      El mostrador de una panadería alemana de los años veinte: una sola barra de pan sobre el mostrador de
      madera y, al lado, una montaña enorme de fajos de billetes que casi lo tapa. Estanterías medio vacías
      detrás. Luz gris de invierno por el escaparate.
    gesto: "mira la montaña de billetes con la boca abierta y las manos en la cabeza"
  - texto: "Billetes para quemar"
    resaltar: "quemar"
    lado: derecha
    escena: &estufa >-
      El interior de una cocina humilde alemana de los años veinte: una estufa de hierro con la puerta abierta y
      fuego dentro, y junto a ella un cesto de mimbre lleno de fajos de billetes en lugar de leña. Ventana con
      escarcha. Luz cálida del fuego.
    gesto: "sostiene un fajo de billetes delante de la estufa con cara de no creérselo"
  - texto: "Doce ceros menos"
    resaltar: "ceros"
    escena: &billete_gigante >-
      Un billete antiguo enorme de los años veinte, de color sepia, lleno de ceros, extendido sobre una mesa de
      madera; a su lado, una sola moneda pequeña y brillante. Sin texto legible, solo filas de ceros. Luz de
      lámpara de mesa.
    gesto: "cuenta ceros con el dedo, mareado"

