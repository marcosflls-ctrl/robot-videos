# Terra: la burbuja de internet que arruinó a medio país
# Guion para revisar. Cada dato lleva su fuente (lista de «fuentes» al final de este bloque).

titulo: "Terra: la acción que pasó de 157 euros a 3 (la burbuja puntocom española)"
descripcion: >-
  En febrero del año 2000, una empresa de internet que casi no ganaba dinero llegó a ser una de las más
  valiosas de la Bolsa española. Cinco años después, su acción valía un 98 % menos. Esta es la historia de
  Terra: la salida a bolsa que desató la fiebre, la compra de Lycos por 12.500 millones de dólares y la
  caída que se llevó por delante los ahorros de cientos de miles de familias.
hashtags: "#historia #economía #bolsa #Terra #burbuja #puntocom #Telefónica"

miniatura:
  texto: "De 157 € a 3 €"
  resaltar: "3"
  cifra: "−98 %"

