capitulos:
# ---------------------------------------------------------------------------------------------
  - titulo: "Telefónica descubre internet"
    short: false
    escenas:
      - voz: "Para entender a Terra hay que volver a 1998. Internet era todavía una rareza: se entraba con un módem que pitaba y bloqueaba el teléfono de casa."
        tipo: foto
        diseno: marco
        imagen: "File:Analog Modem 56K.jpg"
        kicker: "Finales de los noventa"
        texto: "Conectarse era una aventura"
        sub: "Módems de 56 kbps y la línea de teléfono ocupada"
      - voz: "Y era caro: la conexión se pagaba como una llamada, por minutos. Muchos jóvenes descubrían internet en los cibercafés, chateando con desconocidos."
        tipo: ilustracion
        escena: "Un cibercafé español hacia 1999: filas de ordenadores beige con monitores de tubo, adolescentes con auriculares chateando, carteles de precios por hora en la pared, luz fluorescente, ambiente animado."
        kicker: "Cibercafés"
        texto: "Internet se pagaba por minutos"
      - voz: "En Estados Unidos, las empresas de internet ya multiplicaban su valor en bolsa sin ganar un dólar. Y en España, alguien quería subirse a ese tren."
        tipo: ilustracion
        escena: "Una oficina de una empresa tecnológica en Estados Unidos a finales de los noventa: jóvenes con monitores de tubo, carteles de colores, una pizarra con flechas hacia arriba, ambiente eufórico."
        kicker: "Estados Unidos · 1998"
        texto: "La fiebre de las puntocom"
      - voz: "Ese alguien era Telefónica, la antigua compañía pública de teléfonos, recién privatizada y presidida por Juan Villalonga."
        tipo: boceto
        imagen: "File:Edificio Telefónica (Gran Vía 28, Madrid) 01.jpg"
        kicker: "Gran Vía 28 · Madrid"
        nombre: "Telefónica"
        sub: "La antigua compañía pública de teléfonos"
        revelar: true
        fuente: 7
      - voz: "Villalonga, amigo de colegio del presidente del Gobierno, José María Aznar, llegó a Telefónica en 1996 con una idea fija: convertirla en un gigante de internet."
        tipo: titulo
        kicker: "Juan Villalonga · presidente de Telefónica"
        texto: "Una idea fija: ser un gigante de internet"
        resaltar: "gigante de internet"
        fuente: 7
      - voz: "En 1998 nace Telefónica Interactiva, el embrión de lo que sería Terra."
        tipo: fecha
        fecha: "1998"
        lugar: "Nace Telefónica Interactiva"
        fuente: 7
      - voz: "Para ganar tiempo, compró el portal Olé por 2.000 millones de pesetas y un 8 % de las acciones de la nueva empresa."
        tipo: esquema
        modo: cadena
        titulo: "Cómo se montó Terra"
        nodos:
          - {etiqueta: "1998", texto: "Telefónica Interactiva"}
          - {etiqueta: "Compra", texto: "Portal Olé"}
          - {etiqueta: "1999", texto: "Terra Networks", destacar: true}
        flechas: ["2.000 M pts + 8 %", "Nueva marca"]
        fuente: 6
      - voz: "No a todos les gustó el giro. Treinta y seis empleados del proyecto se marcharon para fundar Ya.com, el portal rival que lanzó Jazztel."
        tipo: cifra
        valor: 36
        etiqueta: "empleados que se fueron a fundar Ya.com, la competencia"
        fuente: 6
      - voz: "Luego vinieron portales en Brasil, México, Argentina, Chile y Perú. El plan era ambicioso: ser la puerta de entrada a internet de todo el mundo hispano."
        tipo: mapa
        caja: [-118, 12, -56, 45]
        titulo: "Un portal para todo el mundo hispano"
        grupos:
          - paises: [España]
            color: acento2
            leyenda: "Sede: España"
          - paises: [Brasil, México, Argentina, Chile, Perú, Colombia]
            leyenda: "Portales de Terra"
        fuente: 6
      - voz: "Terra se presentaba como una ciudad virtual: correo, chat, noticias, compras. Todo en un mismo sitio."
        tipo: lista
        titulo: "Lo que prometía Terra"
        puntos:
          - "Correo electrónico gratis"
          - "Chats y foros"
          - "Noticias y entretenimiento"
          - "Compras por internet"
        fuente: 5
      - voz: "Para toda una generación, Terra fue sobre todo su chat: el lugar donde se hacían amigos, se ligaba y se pasaban las tardes."
        tipo: ilustracion
        escena: "Una habitación juvenil española a finales de los noventa: una adolescente frente a un ordenador de tubo de noche, pósters en la pared, un teléfono fijo inalámbrico junto al teclado, la luz azul de la pantalla en su cara."
        diseno: marco
        kicker: "La generación del chat"
        texto: "Tardes enteras en el chat de Terra"
      - voz: "El problema es que todo eso costaba mucho dinero, y apenas ingresaba. Pero en 1999 eso no le importaba a nadie."
        tipo: titulo
        texto: "Costaba mucho y casi no ingresaba"
        resaltar: "casi no ingresaba"

# ---------------------------------------------------------------------------------------------
  - titulo: "La fiebre"
    short: true
    titulo_short: "El día que España se volvió loca por una acción"
    gancho_short:
      - voz: "En 1999 una acción triplicó su precio en un solo día. Y medio país quiso comprarla."
        tipo: titulo
        texto: "Una acción que se triplicó en un día"
        resaltar: "triplicó"
    escenas:
      - voz: "El 17 de noviembre de 1999, Terra salió a bolsa en Madrid y en Nueva York."
        tipo: fecha
        fecha: "17 NOV 1999"
        lugar: "Madrid y Nueva York"
        fuente: 6
      - voz: "Los pequeños inversores podían comprar cada acción a 11,81 euros."
        tipo: cifra
        valor: 11.81
        decimales: 2
        sufijo: " €"
        etiqueta: "precio de salida para los pequeños inversores"
        fuente: 1
      - voz: "Telefónica sacó al mercado alrededor de una cuarta parte de la empresa. El resto se lo quedaba ella."
        tipo: cifra
        valor: 24
        sufijo: " %"
        etiqueta: "parte del capital de Terra que se vendió en la salida a bolsa"
        fuente: 1
      - voz: "La demanda fue tan grande que hubo que repartir las acciones en lotes pequeños, de 25 en 25. Hubo quien hizo cola en la sucursal del banco para conseguirlas."
        tipo: ilustracion
        escena: "Cola de gente variada, con abrigos de finales de los noventa, ante la puerta de una sucursal bancaria española en una calle de Madrid, por la mañana, algunos con el periódico bajo el brazo."
        diseno: sangre
        kicker: "Noviembre de 1999"
        texto: "Colas para comprar acciones"
        fuente: [2, 5]
      - voz: "Ese mismo día, la acción cerró a 37 euros. Había subido un 213 %. Nunca una empresa se había revalorizado tanto en su estreno en la Bolsa española."
        tipo: comparar
        titulo: "El primer día de Terra en bolsa"
        izquierda: {etiqueta: "Precio de salida", valor: 11.81, texto: "11,81 €"}
        derecha: {etiqueta: "Cierre del primer día", valor: 37, texto: "37 €"}
        fuente: 1
      - voz: "Dicho de otra forma: quien metió 1.000 euros por la mañana tenía más de 3.100 euros esa misma noche."
        tipo: comparar
        titulo: "Si hubieras invertido 1.000 € en la salida"
        izquierda: {etiqueta: "Por la mañana", valor: 1000, texto: "1.000 €"}
        derecha: {etiqueta: "Por la noche", valor: 3133, texto: "3.133 €", color: sube}
        fuente: 1
      - voz: "La noticia corrió por los bares, las oficinas y las cenas familiares. Todo el mundo conocía a alguien que había ganado dinero con Terra."
        tipo: ilustracion
        escena: "Un bar español tradicional a finales de los noventa: barra de madera, televisión en lo alto con un gráfico de bolsa subiendo, clientes con traje y obreros comentando animados con cafés y cañas."
        kicker: "La noticia del día"
        texto: "Todo el mundo hablaba de Terra"
      - voz: "Según titulaba El País, los directivos de Terra ganaron 4.496 millones de pesetas sobre el papel con la salida a bolsa."
        tipo: cifra
        texto: "4.496 M pts"
        etiqueta: "lo que ganaron sobre el papel los directivos con la salida a bolsa, según El País (1999)"
        fuente: 6
      - voz: "Y la acción no paraba. En enero del año 2000 entró en el Ibex 35, el índice de las grandes empresas españolas."
        tipo: titulo
        kicker: "Enero de 2000"
        texto: "Terra entra en el Ibex 35"
        resaltar: "Ibex 35"
        fuente: 6
      - voz: "Para muchos españoles, aquella era la primera vez que compraban acciones. La bolsa ya no era cosa de banqueros: era cosa de todos."
        tipo: ilustracion
        escena: "Un matrimonio de jubilados españoles sentados frente a un empleado de banco en su mesa, a finales de los noventa, firmando papeles; folletos de inversión sobre la mesa y un ordenador de tubo."
        diseno: marco
        kicker: "Pequeños inversores"
        texto: "La primera vez en bolsa"

# ---------------------------------------------------------------------------------------------
  - titulo: "157 euros"
    short: true
    titulo_short: "De 11,81 € a 157 € en tres meses"
    gancho_short:
      - voz: "Imagina comprar una acción a 11 euros y verla a 157 tres meses después."
        tipo: titulo
        texto: "De 11 a 157 euros en tres meses"
        resaltar: "157"
    escenas:
      - voz: "El 14 de febrero del año 2000, día de San Valentín, la acción de Terra tocó su máximo histórico: 157,65 euros."
        tipo: fecha
        fecha: "14 FEB 2000"
        lugar: "Máximo histórico"
        fuente: 1
      - voz: "Desde su salida a bolsa, en apenas tres meses, había subido más de un 1.200 %."
        tipo: cifra
        valor: 1234
        sufijo: " %"
        etiqueta: "subida desde el precio de salida hasta el máximo"
        fuente: 1
      - voz: "Aquellos 1.000 euros de la salida se habían convertido en más de 13.000. Sin hacer nada, en tres meses."
        tipo: comparar
        titulo: "Tus 1.000 € de la salida, en el máximo"
        izquierda: {etiqueta: "Noviembre 1999", valor: 1000, texto: "1.000 €"}
        derecha: {etiqueta: "Febrero 2000", valor: 13348, texto: "13.348 €", color: sube}
        fuente: 1
      - voz: "Terra llegó a ser una de las cuatro empresas más valiosas de la Bolsa española, con una capitalización cercana a los 40.000 millones de euros."
        tipo: foto
        diseno: completa
        imagen: "File:Interior Bolsa de Madrid.jpg"
        kicker: "Bolsa de Madrid"
        texto: "Entre las cuatro más valiosas de España"
        fuente: 1
      - voz: "Más que bancos centenarios, con miles de oficinas y beneficios. Y eso que Terra apenas tenía ingresos."
        tipo: ilustracion
        escena: "Sala de operaciones de bolsa en Madrid en el año 2000: operadores con camisa y corbata gritando al teléfono, paneles de cotizaciones luminosos en verde, papeles por el suelo."
        kicker: "Febrero de 2000"
        texto: "La euforia en el parqué"
        fuente: 2
      - voz: "¿Cómo podía valer tanto una empresa que perdía dinero? Porque el mercado no compraba lo que Terra era, sino lo que prometía ser."
        tipo: esquema
        modo: cadena
        titulo: "Cómo se infla una burbuja"
        nodos:
          - {etiqueta: "Paso 1", texto: "Internet crece cada mes"}
          - {etiqueta: "Paso 2", texto: "Se promete ganar mucho en el futuro"}
          - {etiqueta: "Paso 3", texto: "Todos compran y la acción sube"}
          - {etiqueta: "Paso 4", texto: "La subida atrae a más compradores", destacar: true}
        nota: "Y vuelta a empezar, hasta que alguien pregunta por los beneficios"
      - voz: "Como resumió años después el diario Público: nadie sabía de dónde vendrían los beneficios, pero daba igual."
        tipo: cita
        texto: "Nadie sabía de dónde vendrían los beneficios, pero daba igual."
        autor: "Público"
        fecha: "2019"
        fuente: 2
      - voz: "No era solo cosa de España. Al otro lado del Atlántico, el índice tecnológico Nasdaq casi se había multiplicado por cuatro entre 1995 y 1999."
        tipo: linea
        titulo: "El Nasdaq, el índice de las tecnológicas"
        subtitulo: "Cierre de cada año, en puntos"
        valores: [1052, 1291, 1570, 2193, 4069]
        etiquetas: ["1995", "1996", "1997", "1998", "1999"]
        fuente: 8
      - voz: "El 10 de marzo del año 2000, el Nasdaq marcó su máximo. Fue la cima de la burbuja puntocom."
        tipo: foto
        diseno: sangre
        imagen: "File:NASDAQ studio.jpg"
        kicker: "Nasdaq · Nueva York"
        texto: "La cima de la burbuja"
        sub: "El Nasdaq cerró por encima de los 5.000 puntos"
        fuente: 8
      - voz: "Lo que nadie sabía es que, a partir de ese día, todo iba a ir cuesta abajo."
        tipo: titulo
        texto: "A partir de ahí, todo fue cuesta abajo"
        resaltar: "cuesta abajo"

# ---------------------------------------------------------------------------------------------
  - titulo: "La compra de Lycos"
    short: true
    titulo_short: "12.500 millones por un buscador, sin poner un euro"
    gancho_short:
      - voz: "En el año 2000, una empresa española pagó 12.500 millones de dólares por un buscador americano. Sin poner ni un euro en efectivo."
        tipo: titulo
        texto: "12.500 millones sin poner ni un euro"
        resaltar: "ni un euro"
    escenas:
      - voz: "En la primavera del 2000, la acción de Terra ya había caído más de la mitad desde su máximo. Pero todavía valía mucho. Y Terra decidió usar ese valor para comprar."
        tipo: ilustracion
        escena: "Una gran sala de juntas de una empresa española en el año 2000, mesa larga de madera, ejecutivos de espaldas o de perfil sin rasgos definidos, ventanales con vista a Madrid al atardecer, documentos y botellas de agua."
        kicker: "Primavera de 2000"
        texto: "Comprar con acciones"
      - voz: "El objetivo era Lycos, uno de los portales más visitados de Estados Unidos."
        tipo: mapa
        region: mundo
        titulo: "De Madrid a Boston"
        grupos:
          - paises: [España]
            color: acento2
            leyenda: "Terra"
          - paises: [Estados Unidos]
            leyenda: "Lycos"
        etiquetas:
          - {pais: Estados Unidos, texto: "Lycos"}
        fuente: 3
      - voz: "El 16 de mayo del año 2000 se anunció la compra: 12.500 millones de dólares, pagados con acciones de Terra."
        tipo: fecha
        fecha: "16 MAY 2000"
        lugar: "Terra compra Lycos"
        fuente: 3
      - voz: "Era una de las mayores compras de internet de la historia. Nacía Terra Lycos."
        tipo: cifra
        texto: "12.500 M$"
        etiqueta: "lo que pagó Terra por Lycos, en acciones"
        fuente: 3
      - voz: "Terra ofrecía 97,55 dólares por cada acción de Lycos: un 80 % más de lo que valía en bolsa solo cuatro días antes. Una oferta difícil de rechazar."
        tipo: cifra
        valor: 80
        prefijo: "+"
        sufijo: " %"
        etiqueta: "lo que pagaba Terra por encima del precio de Lycos el viernes anterior"
        fuente: 3
      - voz: "Además, el grupo alemán Bertelsmann se comprometió a gastar 1.000 millones de dólares en publicidad en Terra Lycos durante cinco años."
        tipo: cifra
        texto: "1.000 M$"
        etiqueta: "publicidad comprometida por Bertelsmann en cinco años"
        fuente: 6
      - voz: "La jugada tenía truco: Terra no pagaba con dinero, sino con sus propias acciones, que en aquel momento estaban carísimas."
        tipo: esquema
        modo: cadena
        titulo: "La compra con acciones"
        nodos:
          - {etiqueta: "Terra", texto: "Acciones muy caras"}
          - {etiqueta: "Lycos", texto: "Accionistas de Lycos"}
          - {etiqueta: "Resultado", texto: "Terra Lycos", destacar: true}
        flechas: ["Las entrega", "Ceden Lycos"]
        fuente: 3
      - voz: "Pocas semanas después, el protagonista de la historia se caía del cartel."
        tipo: titulo
        texto: "Y entonces cayó Villalonga"
        resaltar: "Villalonga"
      - voz: "En junio del 2000, el diario El Mundo publicó que Villalonga habría usado información privilegiada. En julio dimitió, presionado también por el Gobierno."
        tipo: fecha
        fecha: "JULIO 2000"
        lugar: "Villalonga deja Telefónica"
        fuente: 7
      - voz: "Un mes después, la Comisión Nacional del Mercado de Valores le exculpó. Pero ya no volvería: la era de las grandes apuestas en Telefónica había terminado."
        tipo: ilustracion
        escena: "Un despacho de dirección vacío en una gran empresa en el año 2000: sillón de cuero, mesa despejada con una caja de cartón con objetos personales, luz de tarde entrando por un ventanal con vistas a Madrid."
        diseno: marco
        kicker: "Agosto de 2000"
        texto: "Exculpado, pero fuera"
        fuente: 7
      - voz: "Su sustituto fue César Alierta, que venía de presidir Tabacalera. Él sería quien tendría que gestionar la resaca de Terra."
        tipo: boceto
        imagen: "File:César Alierta 2014 (cropped).jpg"
        kicker: "Presidente de Telefónica desde julio de 2000"
        nombre: "César Alierta"
        sub: "Le tocó gestionar la resaca"
        revelar: true

