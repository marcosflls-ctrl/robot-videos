  - titulo: "La caída"
    short: true
    titulo_short: "Cómo se pinchó la burbuja de Terra"
    escenas:
      - voz: "La burbuja puntocom empezó a desinflarse en todo el mundo. El Nasdaq perdió casi el 80 % de su valor en dos años y medio."
        tipo: linea
        titulo: "El pinchazo del Nasdaq"
        subtitulo: "Cierre de cada año, en puntos"
        valores: [1052, 1291, 1570, 2193, 4069, 2471, 1950, 1336]
        etiquetas: ["1995", "1996", "1997", "1998", "1999", "2000", "2001", "2002"]
        marcas:
          - {indice: 4, texto: "Fin de 1999"}
        fuente: 8
      - voz: "Las empresas de internet empezaron a cerrar una tras otra. Los inversores se dieron cuenta de que muchas nunca iban a ganar dinero."
        tipo: ilustracion
        escena: "Una oficina de empresa de internet abandonada hacia 2001: mesas vacías, monitores de tubo apagados, cajas de cartón, sillas giratorias desordenadas, una planta seca, luz fría por los ventanales."
        kicker: "2001"
        texto: "Las puntocom se apagan"
      - voz: "Terra no fue una excepción. En 2001 ingresó unos 690 millones de euros… y perdió más de 5.000."
        tipo: comparar
        titulo: "Las cuentas de Terra en 2001"
        izquierda: {etiqueta: "Ingresos", valor: 690, texto: "690 M€", color: sube}
        derecha: {etiqueta: "Pérdidas", valor: 5663, texto: "−5.663 M€", color: baja}
        fuente: 5
      - voz: "Detrás de esas pérdidas estaba, sobre todo, lo pagado por Lycos y otras compras, que hubo que ir rebajando en las cuentas."
        tipo: esquema
        modo: causas
        titulo: "Por qué se hundió Terra"
        nodos:
          - {etiqueta: "El mercado", texto: "Se pincha la burbuja puntocom"}
          - {etiqueta: "Las cuentas", texto: "Pérdidas enormes y pocos ingresos"}
          - {etiqueta: "Las compras", texto: "Lycos valía mucho menos de lo pagado"}
        resultado: {etiqueta: "Resultado", texto: "La acción se desploma"}
        fuente: [5, 9]
      - voz: "La fecha en la que Terra iba a empezar a ganar dinero se fue retrasando: primero era 2003, luego 2005."
        tipo: esquema
        modo: cadena
        titulo: "La rentabilidad, siempre más lejos"
        nodos:
          - {etiqueta: "Promesa", texto: "Beneficios en 2003"}
          - {etiqueta: "Nueva promesa", texto: "Beneficios en 2005", destacar: true}
        flechas: ["Se aplaza"]
        fuente: 1
      - voz: "Mes a mes, la acción siguió bajando. Los pequeños inversores que habían entrado en lo más alto veían cómo sus ahorros se evaporaban."
        tipo: ilustracion
        escena: "Un hombre de mediana edad sentado de noche frente a un ordenador de tubo en un salón español a principios de los 2000, iluminado por la pantalla con un gráfico rojo que cae, una taza de café fría al lado."
        diseno: sangre
        kicker: "2001 – 2002"
        texto: "Los ahorros se evaporan"
      - voz: "En mayo de 2003, Telefónica lanzó una oferta para comprar las acciones de Terra que no tenía. Ofrecía 5,25 euros por acción."
        tipo: cifra
        valor: 5.25
        decimales: 2
        sufijo: " €"
        etiqueta: "lo que ofreció Telefónica por cada acción de Terra (mayo de 2003)"
        fuente: [1, 4]
      - voz: "Menos de la mitad del precio de salida. Y treinta veces menos que en el máximo."
        tipo: barras
        titulo: "El precio de una acción de Terra"
        subtitulo: "En euros, en cuatro momentos clave"
        valores: [11.81, 37, 157.65, 5.25]
        etiquetas: ["Salida 1999", "1.er día", "Máximo 2000", "Oferta 2003"]
        decimales: 2
        destacar: [3]
        fuente: [1, 4]
      - voz: "La asociación de consumidores Adicae calculó que medio millón de familias podían perder más del 60 % de lo que habían invertido."
        tipo: cifra
        texto: "500.000"
        etiqueta: "familias que podían perder más del 60 % de su inversión, según Adicae (2003)"
        fuente: 4
      - voz: "Su presidente, Manuel Pardos, lo dijo sin rodeos."
        tipo: cita
        texto: "Ruina para medio millón de familias."
        autor: "Manuel Pardos, presidente de Adicae"
        fecha: "junio de 2003"
        fuente: 4
      - voz: "Hubo demandas colectivas en Nueva York y recursos en España. Pero Telefónica se hizo con más del 70 % de Terra."
        tipo: ilustracion
        escena: "Una reunión de pequeños accionistas indignados en un salón de actos sencillo de Madrid hacia 2003: sillas plegables, personas mayores y de mediana edad con carpetas y papeles, un hombre habla de pie, ambiente tenso."
        kicker: "2003"
        texto: "Los pequeños accionistas se organizan"
        fuente: 5

# ---------------------------------------------------------------------------------------------
  - titulo: "El final"
    short: true
    titulo_short: "Pagaron 12.500 millones y lo vendieron por 100"
    gancho_short:
      - voz: "Una empresa española pagó 12.500 millones de dólares por un buscador. Cuatro años después lo vendió por menos del 1 %."
        tipo: titulo
        texto: "Pagó 12.500 millones y lo vendió por menos del 1 %"
        resaltar: "menos del 1 %"
    escenas:
      - voz: "En 2004 llegó la humillación final de la gran apuesta: Lycos se vendió a la empresa surcoreana Daum."
        tipo: mapa
        region: mundo
        titulo: "Lycos cambia de manos"
        grupos:
          - paises: [Estados Unidos]
            leyenda: "Lycos"
          - paises: [Corea del Sur]
            color: acento2
            leyenda: "Daum, el comprador"
        etiquetas:
          - {pais: Corea del Sur, texto: "Daum"}
        fuente: 6
      - voz: "El precio: unos 100 millones de dólares. Menos del 1 % de lo que Terra había pagado cuatro años antes."
        tipo: comparar
        titulo: "Lycos: lo que costó y lo que se sacó"
        izquierda: {etiqueta: "Compra (2000)", valor: 12500, texto: "12.500 M$"}
        derecha: {etiqueta: "Venta (2004)", valor: 105, texto: "≈100 M$", color: baja}
        fuente: [6, 9]
      - voz: "En 2005, Telefónica absorbió a Terra. Cada nueve acciones de Terra se cambiaron por dos de Telefónica."
        tipo: esquema
        modo: cadena
        titulo: "La fusión de 2005"
        nodos:
          - {etiqueta: "Antes", texto: "9 acciones de Terra"}
          - {etiqueta: "Después", texto: "2 acciones de Telefónica", destacar: true}
        flechas: ["Canje"]
        fuente: 1
      - voz: "El 15 de julio de 2005, la acción de Terra cotizó por última vez. Cerró a 3,04 euros."
        tipo: fecha
        fecha: "15 JUL 2005"
        lugar: "Último día en bolsa"
        fuente: 1
      - voz: "Un 98 % menos que en su mejor día."
        tipo: cifra
        valor: -98
        sufijo: " %"
        color: baja
        etiqueta: "caída desde el máximo de febrero de 2000"
        fuente: 1
      - voz: "¿Qué le quedó a cada inversor? Quien compró en la salida y aguantó hasta el final, el último día tenía acciones por valor de unos 257 euros de cada 1.000 invertidos."
        tipo: comparar
        titulo: "1.000 € invertidos en la salida (1999)"
        izquierda: {etiqueta: "Invertido", valor: 1000, texto: "1.000 €"}
        derecha: {etiqueta: "Último día (2005)", valor: 257, texto: "257 €", color: baja}
        fuente: 1
      - voz: "Pero quien se dejó llevar por la euforia y compró en lo más alto, se quedó con unos 19 euros de cada 1.000."
        tipo: comparar
        titulo: "1.000 € invertidos en el máximo (2000)"
        izquierda: {etiqueta: "Invertido", valor: 1000, texto: "1.000 €"}
        derecha: {etiqueta: "Último día (2005)", valor: 19, texto: "19 €", color: baja}
        fuente: 1
      - voz: "Entre el máximo y su desaparición, se esfumaron unos 47.000 millones de euros de valor en bolsa."
        tipo: cifra
        texto: "47.000 M€"
        etiqueta: "valor en bolsa que desapareció entre 2000 y 2005, según Público"
        fuente: 2
      - voz: "La marca sobrevivió unos años más. Hasta que, en 2017, Terra cerró su correo y sus portales en casi todos los países."
        tipo: ilustracion
        escena: "Un portátil abierto sobre una mesa de cocina en 2017, con la pantalla iluminando suavemente una habitación en penumbra; al lado una taza y unas gafas, ambiente de despedida."
        diseno: marco
        kicker: "2017"
        texto: "El último correo de Terra"
        fuente: 6
      - voz: "Hoy, Terra es un recuerdo para los que crecieron con su chat. Y una lección para los que invirtieron en ella."
        tipo: titulo
        texto: "Un recuerdo y una lección"
        resaltar: "lección"
      - voz: "Una lección que se puede resumir en tres ideas."
        tipo: lista
        titulo: "Lo que nos enseñó Terra"
        puntos:
          - "Una empresa vale lo que gana, no lo que promete"
          - "Si todo el mundo compra, quizá llegas tarde"
          - "No pongas todos tus ahorros en una sola acción"
      - voz: "Cada pocos años aparece una nueva revolución que promete cambiarlo todo. A veces lo consigue. Pero eso no significa que cualquier precio sea un buen precio."
        tipo: ilustracion
        escena: "Una persona joven de espaldas mira por la ventana de un piso moderno la ciudad de Madrid al anochecer, con el móvil en la mano mostrando un gráfico; en la mesa, un viejo módem y un periódico doblado del año 2000, como recuerdo."
        kicker: "Hoy"
        texto: "Cada época tiene su burbuja"

