# ---------------------------------------------------------------------------------------------
gancho:
  - voz: "En noviembre de 2002, un petrolero con setenta y siete mil toneladas de fuel pidió socorro frente a Galicia. Y ningún puerto quiso recibirlo."
    tipo: ilustracion
    escena: *petrolero_escorado
    kicker: "Costa da Morte · noviembre de 2002"
    ambiente: lluvia
    sonido: viento
    fuente: [1, 2]
  - voz: "Lo remolcaron mar adentro durante seis días. Hasta que se partió en dos."
    tipo: titulo
    texto: "Seis días. Y se partió en dos"
    resaltar: "se partió en dos"
    fuente: [1, 2]
  - voz: "El fuel acabó en más de mil playas. ¿Por qué se alejó el barco en vez de llevarlo a puerto? De esa decisión se sigue discutiendo hoy."
    tipo: ilustracion
    escena: *playa_negra
    texto: "¿Por qué lo alejaron?"
    resaltar: "alejaron"
    fuente: [1, 2]

capitulos:
# ---------------------------------------------------------------------------------------------
  - titulo: "Un barco viejo en mitad del temporal"
    titulo_short: "El petrolero de 26 años que se rajó frente a Galicia"
    short: true
    cierre_short: "Lo que decidieron hacer con él lo cambió todo. Te lo cuento en el vídeo del canal"
    gancho_short:
      - voz: "Un petrolero de veintiséis años, con un solo casco y setenta y siete mil toneladas de fuel, se rajó en pleno temporal frente a Galicia."
        tipo: cifra
        valor: 77000
        sufijo: " t"
        etiqueta: "De fuel a bordo del Prestige"
        fuente: [1, 2]
    escenas:
      - voz: "El Prestige tenía veintiséis años. Era un petrolero de un solo casco: entre el fuel y el mar solo había una plancha de acero."
        tipo: comparar
        titulo: "Un casco o dos"
        izquierda: {etiqueta: "Casco sencillo (Prestige)", valor: 1, texto: "1 pared de acero"}
        derecha: {etiqueta: "Doble casco", valor: 2, texto: "2 paredes"}
        en_short: true
        fuente: 2
      - voz: "Acababa de pasar por reparaciones en China y tenía en regla sus certificados de navegación. Sobre el papel, podía navegar."
        tipo: titulo
        texto: "Sobre el papel, todo en regla"
        resaltar: "Sobre el papel"
        fuente: 6
      - voz: "Navegaba con bandera de Bahamas, lo gestionaba una empresa griega y su dueña era una sociedad de Liberia. Había salido de San Petersburgo."
        tipo: lista
        titulo: "¿De quién era el Prestige?"
        puntos: ["Bandera: Bahamas", "Dueña: una sociedad de Liberia", "Gestión: una empresa griega", "Carga: fuel pesado ruso"]
        fuente: [1, 2]
      - voz: "Medía doscientos cuarenta y tres metros, más que dos campos de fútbol seguidos. Había cargado en San Petersburgo y en Letonia, e iba hacia Singapur pasando por Gibraltar."
        tipo: cifra
        valor: 243
        sufijo: " m"
        etiqueta: "De eslora del Prestige"
        fuente: 5
      - voz: "Llevaba setenta y siete mil toneladas de fuel pesado: un combustible espeso, negro y pegajoso, de los más difíciles de limpiar."
        tipo: ilustracion
        escena: &fuel >-
          Lámina de naturalista: un tarro de cristal lleno de un líquido negro, espeso y brillante, del que cuelga
          un hilo viscoso desde una espátula de madera; al lado, una pluma de ave manchada de negro y una concha.
          Fondo de papel claro.
        kicker: "Fuel pesado"
        texto: "Espeso, negro y pegajoso"
        fuente: 2
      - voz: "El trece de noviembre de 2002, en mitad de un temporal, el capitán lanzó un S.O.S. Estaba a veintiocho millas de Finisterre, unos cincuenta kilómetros."
        tipo: fecha
        fecha: "13 de noviembre de 2002 · 15:15"
        lugar: "S.O.S. a 28 millas de Finisterre"
        en_short: true
        fuente: 1
      - voz: "El casco se había abierto por un costado. El barco se inclinó, y el fuel empezó a salir al mar."
        tipo: ilustracion
        escena: *petrolero_escorado
        texto: "El casco se abrió"
        resaltar: "se abrió"
        ambiente: lluvia
        en_short: true
        fuente: [1, 2]
      - voz: "Se inclinó hasta treinta grados. Los helicópteros de Salvamento Marítimo rescataron a veinticuatro de los veintisiete tripulantes. A bordo se quedaron tres: el capitán, el primer oficial y el jefe de máquinas."
        tipo: comparar
        titulo: "Los 27 tripulantes"
        izquierda: {etiqueta: "Rescatados en helicóptero", valor: 24, texto: "24"}
        derecha: {etiqueta: "Se quedan a bordo", valor: 3, texto: "3"}
        fuente: 5
      - voz: "Esa misma noche, los remolcadores intentaron engancharlo. El sistema de remolque de emergencia del barco falló. El Prestige iba a la deriva hacia la costa."
        tipo: ilustracion
        escena: &noche_remolcadores >-
          De noche, en pleno temporal, dos remolcadores pequeños con focos encendidos se acercan a un petrolero
          enorme y escorado; un cable cuelga roto entre ellos. Olas enormes, lluvia horizontal iluminada por los
          focos. La costa, una línea oscura con unas pocas luces.
        texto: "A la deriva hacia la costa"
        resaltar: "hacia la costa"
        ambiente: lluvia
        fuente: 5

# ---------------------------------------------------------------------------------------------
  - titulo: "Seis días a la deriva"
    titulo_short: "Por qué alejaron el Prestige en vez de llevarlo a puerto"
    short: true
    cierre_short: "Y el fuel volvió. Adónde llegó, en el vídeo completo del canal"
    gancho_short:
      - voz: "Tenían un petrolero roto a cincuenta kilómetros de la costa. Y decidieron llevárselo lejos."
        tipo: titulo
        texto: "Decidieron llevárselo lejos"
        resaltar: "lejos"
        kicker: "Prestige · 2002"
        fuente: [1, 2]
    escenas:
      - voz: "Había dos opciones. Una: meterlo en un puerto o una ría, vaciarlo allí y aceptar que esa zona se mancharía. Otra: alejarlo todo lo posible."
        tipo: comparar
        titulo: "Las dos opciones"
        izquierda: {etiqueta: "Llevarlo a puerto", valor: 1, texto: "Daño en un punto"}
        derecha: {etiqueta: "Alejarlo", valor: 1, texto: "Lejos de la costa"}
        en_short: true
        fuente: [1, 2]
      - voz: "El catorce de noviembre, una empresa de salvamento holandesa, Smit, tomó el remolque. Las autoridades españolas tenían que decidir adónde llevarlo."
        tipo: ilustracion
        escena: *remolque
        kicker: "14 de noviembre de 2002"
        texto: "¿Adónde llevarlo?"
        resaltar: "Adónde"
        fuente: 5
      - voz: "Según publicó la prensa, un remolcador propuso llevarlo al puerto de A Coruña. La propuesta se rechazó."
        tipo: titulo
        texto: "A Coruña: rechazado"
        resaltar: "rechazado"
        fuente: 1
      - voz: "El catorce de noviembre, con el fuel llegando ya a Muxía, el Ministerio de Fomento ordenó alejar el barco de la costa."
        tipo: fecha
        fecha: "14 de noviembre de 2002"
        lugar: "Orden de alejar el Prestige"
        fuente: 1
      - voz: "España no lo quería cerca. Francia y Portugal, tampoco. El Prestige fue remolcado mar adentro, cambiando de rumbo, con el casco roto y dejando una estela de fuel."
        tipo: ilustracion
        escena: *remolque
        texto: "Ningún país lo quería"
        resaltar: "Ningún"
        en_short: true
        fuente: 2
      - voz: "El temporal siguió golpeando un barco que ya estaba herido. El quince de noviembre, la grieta del costado medía treinta y cinco metros."
        tipo: ilustracion
        escena: &grieta >-
          Primer plano del costado de un petrolero viejo de acero negro con una grieta vertical enorme por la que
          sale fuel negro al mar, mientras una ola rompe contra él. Remaches y óxido visibles. Luz gris de
          tormenta.
        texto: "La grieta crecía"
        ambiente: lluvia
        fuente: 2
      - voz: "El dieciséis de noviembre, el rumbo cambió otra vez: hacia el suroeste, para no entrar en aguas de Portugal, que había mandado su marina para impedírselo."
        tipo: fecha
        fecha: "16 de noviembre de 2002"
        lugar: "Nuevo rumbo al suroeste para evitar Portugal"
        fuente: [2, 5]
      - voz: "El diecinueve de noviembre, a primera hora, el Prestige se partió en dos. Se hundió a más de doscientos kilómetros de Galicia, a más de tres mil metros de profundidad."
        tipo: fecha
        fecha: "19 de noviembre de 2002"
        lugar: "El Prestige se parte en dos y se hunde"
        en_short: true
        fuente: [1, 2]
      - voz: "Se partió a las nueve de la mañana. La popa se hundió a mediodía, a tres mil quinientos metros de profundidad. La proa, hacia las cuatro de la tarde."
        tipo: lista
        titulo: "19 de noviembre de 2002"
        puntos: ["09:00 · se parte en dos", "12:00 · se hunde la popa", "16:00 · se hunde la proa", "A 3.500 metros de profundidad"]
        fuente: 5

# ---------------------------------------------------------------------------------------------
  - titulo: "La marea negra"
    titulo_short: "El fuel del Prestige llegó a más de mil playas"
    short: true
    cierre_short: "¿Quién limpió todo eso? Te lo cuento en el vídeo completo del canal"
    gancho_short:
      - voz: "Lo hundieron lejos para salvar la costa. Y el fuel acabó en más de mil playas."
        tipo: cifra
        valor: 1000
        prefijo: "+"
        etiqueta: "Playas manchadas de fuel"
        fuente: 2
    escenas:
      - voz: "Cuando el barco se hundió, la mancha ya cubría ciento setenta kilómetros de costa. Y seguía creciendo."
        tipo: cifra
        valor: 170
        sufijo: " km"
        etiqueta: "De costa manchada el día del hundimiento"
        fuente: 6
      - voz: "Alejar el barco no alejó el fuel. Al contrario: lo repartió. El mar y el viento lo fueron devolviendo a tierra en oleadas, durante semanas."
        tipo: ilustracion
        escena: *playa_negra
        texto: "El mar lo devolvió"
        resaltar: "devolvió"
        en_short: true
        fuente: [1, 2]
      - voz: "Se calcula que salieron al mar unas sesenta y tres mil toneladas. Más del ochenta por ciento de la carga."
        tipo: comparar
        titulo: "El fuel del Prestige"
        izquierda: {etiqueta: "Carga", valor: 77, texto: "77.000 t"}
        derecha: {etiqueta: "Vertido al mar", valor: 63, texto: "63.000 t"}
        en_short: true
        fuente: 2
      - voz: "El fuel pesado no flota como una mancha fina. Forma placas y bolas espesas que viajan con las corrientes y pueden aparecer en la costa semanas después, muy lejos de donde salieron."
        tipo: ilustracion
        escena: *fuel
        texto: "Viaja con las corrientes"
        resaltar: "corrientes"
        fuente: [2, 4]
      - voz: "Primero Galicia. A finales de noviembre, Asturias. Después Cantabria, el País Vasco y la costa de Francia."
        tipo: esquema
        modo: cadena
        titulo: "El camino del fuel"
        nodos:
          - {etiqueta: "1", texto: "Galicia", destacar: true}
          - {etiqueta: "2", texto: "Asturias"}
          - {etiqueta: "3", texto: "Cantabria"}
          - {etiqueta: "4", texto: "País Vasco"}
          - {etiqueta: "5", texto: "Francia"}
        nota: "De noviembre de 2002 en adelante"
        en_short: true
        fuente: [1, 2]
      - voz: "En total se mancharon casi tres mil kilómetros de costa en España, Francia y Portugal, y mil ciento cuarenta playas."
        tipo: comparar
        titulo: "La costa manchada"
        izquierda: {etiqueta: "Kilómetros de costa", valor: 2900, texto: "≈ 2.900 km"}
        derecha: {etiqueta: "Playas", valor: 1140, texto: "1.140"}
        fuente: 5
      - voz: "En Galicia lo llamaron chapapote. Una pasta negra que cubría rocas, arena, redes y animales."
        tipo: titulo
        texto: "Chapapote"
        kicker: "La palabra de aquel invierno"
        fuente: 1
      - voz: "Las rocas, los percebes, los mejillones, las algas: todo quedó cubierto. En las islas Ons se fotografiaron cangrejos negros de fuel."
        tipo: ilustracion
        escena: &rocas >-
          Primer plano de unas rocas de la costa gallega en marea baja cubiertas de una capa negra y brillante de
          fuel, con mejillones, percebes y un cangrejo pequeño manchados de negro; algas pegadas. Luz gris de
          invierno, gotas de agua.
        kicker: "Islas Ons · diciembre de 2002"
        texto: "Todo quedó cubierto"
        fuente: 6
      - voz: "En seis meses se recogieron más de veintitrés mil aves manchadas. Diecisiete mil ya estaban muertas."
        tipo: comparar
        titulo: "Aves recogidas en seis meses"
        izquierda: {etiqueta: "Total", valor: 23181, texto: "23.181"}
        derecha: {etiqueta: "Muertas", valor: 17061, texto: "17.061"}
        fuente: 1
      - voz: "Y esas son solo las que se encontraron. La mayoría murió en el mar. Las estimaciones van de ciento quince mil a doscientas treinta mil aves muertas."
        tipo: cifra
        valor: 230000
        prefijo: "hasta "
        etiqueta: "Aves muertas estimadas (entre 115.000 y 230.000)"
        fuente: 5
      - voz: "La pesca y el marisqueo se prohibieron en el noventa por ciento de la costa gallega, una costa que vivía de ellos. Las últimas prohibiciones no se levantaron hasta octubre de 2003."
        tipo: ilustracion
        escena: &puerto_parado >-
          Un pequeño puerto pesquero gallego en invierno con barcos de colores amarrados y sin salir, redes
          amontonadas en el muelle y nasas apiladas; el agua junto al muelle tiene manchas negras. Casas de piedra
          y cielo gris.
        texto: "La flota, amarrada"
        resaltar: "amarrada"
        fuente: [2, 4]

# ---------------------------------------------------------------------------------------------
  - titulo: "Nunca Máis"
    titulo_short: "Miles de personas limpiaron el fuel del Prestige con las manos"
    short: true
    cierre_short: "¿Y quién pagó todo aquello? La respuesta, en el vídeo del canal"
    gancho_short:
      - voz: "Miles de personas cruzaron España para limpiar el fuel de las playas. Muchas, con las manos."
        tipo: titulo
        texto: "Lo limpiaron con las manos"
        resaltar: "manos"
        kicker: "Galicia · 2002"
        fuente: 1
    escenas:
      - voz: "Los primeros en salir fueron los marineros. Con sus propios barcos y lo que tenían a mano, intentaron parar el fuel antes de que entrara en las rías."
        tipo: ilustracion
        escena: &marineros >-
          Varias barcas pequeñas de pesca gallegas en el mar junto a una mancha negra de fuel: muñecos de palo
          diminutos con trajes de agua amarillos sacan pasta negra del agua con redes, cubos y palas. Costa rocosa
          al fondo, cielo gris.
        texto: "Los marineros, los primeros"
        en_short: true
        fuente: 1
      - voz: "Más de mil barcos pesqueros salieron a recoger fuel en alta mar, junto a barcos de diez países europeos. Fue probablemente la mayor limpieza en el mar de la historia."
        tipo: cifra
        valor: 1000
        prefijo: "+"
        etiqueta: "Pesqueros recogiendo fuel en el mar"
        fuente: 4
      - voz: "Entre todos sacaron del agua unas cincuenta mil toneladas de mezcla de fuel y agua. Y se tendieron más de veinte kilómetros de barreras para proteger las rías."
        tipo: comparar
        titulo: "La limpieza en el mar"
        izquierda: {etiqueta: "Fuel y agua recogidos", valor: 50000, texto: "50.000 t"}
        derecha: {etiqueta: "Barreras en las rías", valor: 20, texto: "+20 km"}
        fuente: 4
      - voz: "Después llegaron miles de voluntarios de toda España y de fuera. Con monos blancos, mascarillas y palas, llenaron las playas durante meses."
        tipo: ilustracion
        escena: &voluntarios >-
          Una playa gallega cubierta de fuel negro en la que trabajan decenas de figuras diminutas de tinta con
          monos blancos manchados de negro, llenando capazos y pasándolos en cadena hacia unos contenedores.
          Acantilados y cielo gris de invierno.
        texto: "La marea blanca"
        resaltar: "blanca"
        en_short: true
        fuente: 1
      - voz: "Al principio, muchos trabajaban sin trajes ni mascarillas. Solo en España se recogieron ciento cuarenta y un mil toneladas de residuos. En Francia, otras dieciocho mil."
        tipo: comparar
        titulo: "Residuos recogidos en la costa"
        izquierda: {etiqueta: "España", valor: 141000, texto: "141.000 t"}
        derecha: {etiqueta: "Francia", valor: 18300, texto: "18.300 t"}
        fuente: [4, 6]
      - voz: "El uno de diciembre, ciento cincuenta mil personas se manifestaron en Santiago de Compostela bajo un lema: Nunca Máis. Nunca más."
        tipo: cifra
        valor: 150000
        etiqueta: "Manifestantes en Santiago (1 de diciembre de 2002)"
        en_short: true
        fuente: 1
      - voz: "Mientras, el Gobierno quitaba importancia a lo que seguía saliendo del barco hundido. El cinco de diciembre, el vicepresidente lo describió como unos hilitos."
        tipo: titulo
        texto: "«Unos hilitos»"
        kicker: "5 de diciembre de 2002"
        fuente: 1
      - voz: "Pero el barco hundido seguía soltando fuel: unas ciento veinticinco toneladas cada día."
        tipo: cifra
        valor: 125
        sufijo: " t al día"
        etiqueta: "De fuel que seguía saliendo del barco hundido"
        fuente: 2
      - voz: "Durante meses, el pecio fue una bomba de relojería en el fondo del mar. Nadie había vaciado nunca un petrolero hundido a esa profundidad."
        tipo: titulo
        texto: "Una bomba en el fondo del mar"
        resaltar: "bomba"
        fuente: [2, 4]
      - voz: "En 2004, una operación a más de tres mil metros de profundidad sacó el fuel que quedaba dentro: unas trece mil toneladas. Costó más de cien millones de euros."
        tipo: ilustracion
        escena: &pecio >-
          El fondo del océano a gran profundidad, casi negro: la mitad de un petrolero hundido apoyada en el lecho
          marino, iluminada por los focos de un robot submarino pequeño que se acerca con un brazo mecánico.
          Partículas en el agua.
        kicker: "2004"
        texto: "Vaciar el barco hundido"
        fuente: [1, 2]

# ---------------------------------------------------------------------------------------------
  - titulo: "No era la primera vez"
    titulo_short: "Diez años antes del Prestige, otro petrolero ardió frente a A Coruña"
    short: true
    cierre_short: "Y después llegó el Prestige. La historia completa, en el canal"
    gancho_short:
      - voz: "Diez años antes del Prestige, otro petrolero se partió y ardió frente a A Coruña. La ciudad tuvo que ser evacuada por el humo."
        tipo: titulo
        texto: "Diez años antes, otro petrolero"
        resaltar: "otro petrolero"
        kicker: "A Coruña · 1992"
        fuente: 7
    escenas:
      - voz: "La costa gallega se llama Costa da Morte por algo: sus rocas y sus temporales han hundido barcos durante siglos. Y por delante de ella pasa una de las rutas de petroleros más transitadas de Europa."
        tipo: ilustracion
        escena: &costa_morte >-
          Los acantilados de la Costa da Morte en Galicia con un faro blanco sobre las rocas y olas enormes
          rompiendo; a lo lejos, en el horizonte, una fila de tres petroleros navegando. Cielo de tormenta con un
          rayo de sol. Sin personas.
        kicker: "Costa da Morte"
        texto: "Una costa que hunde barcos"
        fuente: [2, 7]
      - voz: "El tres de diciembre de 1992, el petrolero Mar Egeo iba hacia la refinería de A Coruña con setenta y nueve mil toneladas de crudo. Con vientos de más de noventa kilómetros por hora y casi sin visibilidad, encalló junto a la Torre de Hércules."
        tipo: fecha
        fecha: "3 de diciembre de 1992"
        lugar: "El Mar Egeo encalla junto a la Torre de Hércules"
        en_short: true
        fuente: 7
      - voz: "Se partió en dos y ardió durante unos cinco días. El humo obligó a evacuar parte de la ciudad. Los treinta y dos tripulantes se salvaron en helicóptero."
        tipo: ilustracion
        escena: &mar_egeo >-
          Un petrolero partido en dos y en llamas junto a la costa, con una columna enorme de humo negro que se
          extiende sobre una ciudad costera; en un cabo cercano, una torre de piedra antigua y cuadrada. Noche
          iluminada por el fuego, mar agitado.
        kicker: "Mar Egeo · 1992"
        texto: "Cinco días ardiendo"
        resaltar: "ardiendo"
        en_short: true
        fuente: 7
      - voz: "Salieron al mar unas sesenta y siete mil toneladas de petróleo, casi tanto como en el Prestige, y se mancharon hasta trescientos kilómetros de costa."
        tipo: comparar
        titulo: "Dos mareas negras en Galicia"
        izquierda: {etiqueta: "Mar Egeo (1992)", valor: 67, texto: "67.000 t"}
        derecha: {etiqueta: "Prestige (2002)", valor: 63, texto: "63.000 t"}
        en_short: true
        fuente: [2, 7]
      - voz: "Y tres años antes del Prestige, en diciembre de 1999, el petrolero Erika, de casi veinticinco años, se partió frente a Bretaña con treinta y un mil toneladas de fuel. Europa empezó a endurecer las normas."
        tipo: fecha
        fecha: "12 de diciembre de 1999"
        lugar: "El Erika se hunde frente a Bretaña"
        fuente: 8
      - voz: "En aquel caso, la justicia francesa condenó a la petrolera que había fletado el barco, por imprudencia, al tener en cuenta su edad y su mal mantenimiento."
        tipo: titulo
        texto: "Condenada la petrolera"
        resaltar: "Condenada"
        kicker: "Caso Erika · 2008"
        fuente: 8
      - voz: "La lección estaba ahí. Pero en 2002 seguían navegando cerca de Galicia petroleros viejos, de un solo casco, como el Prestige."
        tipo: ilustracion
        escena: *petrolero_escorado
        texto: "La lección no llegó a tiempo"
        fuente: 2

# ---------------------------------------------------------------------------------------------
  - titulo: "¿Quién paga una marea negra?"
    titulo_short: "1.500 millones por el Prestige: cobrarlos es otra historia"
    short: true
    cierre_short: "¿Cómo se llegó a esto? La historia completa del Prestige, en el canal"
    gancho_short:
      - voz: "La justicia fijó más de mil quinientos millones de euros por el Prestige. Cobrarlos es otra historia."
        tipo: cifra
        valor: 1500
        prefijo: "+"
        sufijo: " M€"
        etiqueta: "Indemnizaciones fijadas por el Tribunal Supremo"
        fuente: 3
    escenas:
      - voz: "El juicio no empezó hasta octubre de 2012. Diez años después del hundimiento."
        tipo: cifra
        valor: 10
        sufijo: " años"
        etiqueta: "Entre el hundimiento y el inicio del juicio"
        en_short: true
        fuente: 1
      - voz: "Fue uno de los juicios más grandes de España: mil quinientos perjudicados, trescientas mil páginas de documentos y ciento treinta y tres testigos. Uno de los acusados, el primer oficial, nunca apareció."
        tipo: lista
        titulo: "El juicio del Prestige"
        puntos: ["1.500 perjudicados", "300.000 páginas", "133 testigos", "Unos 100 peritos"]
        fuente: 5
      - voz: "En 2013, la primera sentencia no condenó a nadie por delito ecológico. Al capitán le cayeron nueve meses por desobediencia, y no pisó la cárcel por su edad: setenta y ocho años."
        tipo: fecha
        fecha: "Noviembre de 2013"
        lugar: "Primera sentencia: sin condenas por delito ecológico"
        fuente: [2, 5]
      - voz: "En 2016, el Tribunal Supremo la corrigió: condenó al capitán, Apostolos Mangouras, a dos años de cárcel por imprudencia. El Estado quedó absuelto."
        tipo: fecha
        fecha: "26 de enero de 2016"
        lugar: "El Supremo condena al capitán a dos años"
        en_short: true
        fuente: [1, 2]
      - voz: "España y Francia reclamaban unos cuatro mil millones de euros. El fondo internacional para mareas negras solo cubría unos ciento setenta y un millones de libras."
        tipo: comparar
        titulo: "Lo que se reclamaba y lo que había"
        izquierda: {etiqueta: "Reclamado por España y Francia", valor: 4000, texto: "≈ 4.000 M€"}
        derecha: {etiqueta: "Límite del fondo internacional", valor: 200, texto: "171 M£"}
        fuente: [4, 5]
      - voz: "España y Francia recurrieron al Supremo pocos días después. Solo en Francia, los daños se calcularon en ciento diez millones de euros, y diecisiete municipios de la costa de las Landas se personaron en la causa."
        tipo: cifra
        valor: 110
        sufijo: " M€"
        etiqueta: "Daños calculados solo en Francia"
        fuente: 5
      - voz: "Y en 2018 fijó las indemnizaciones: más de mil quinientos millones de euros, sobre todo a cargo de la aseguradora británica del barco."
        tipo: ilustracion
        escena: &balanza >-
          Lámina dibujada a mano de una balanza antigua de latón: en un platillo, un petrolero pequeño de juguete
          manchado de negro; en el otro, una pila alta de monedas. Fondo de papel claro, sin texto.
        texto: "1.500 millones de euros"
        resaltar: "1.500 millones"
        en_short: true
        fuente: [2, 3]
      - voz: "Cobrarlo es otra cosa. En 2023, la justicia inglesa se negó a ejecutar la sentencia española contra la aseguradora."
        tipo: titulo
        texto: "Londres se negó a ejecutarla"
        resaltar: "se negó"
        kicker: "2023"
        en_short: true
        fuente: 2
      - voz: "Para las organizaciones ecologistas, la conclusión es clara: alejar el barco convirtió un desastre local en uno que afectó a medio continente. Otros expertos defienden que llevarlo a puerto también tenía riesgos. El debate sigue abierto."
        tipo: comparar
        titulo: "¿Alejarlo o llevarlo a puerto?"
        izquierda: {etiqueta: "Críticos", valor: 1, texto: "Repartió el desastre"}
        derecha: {etiqueta: "Defensores", valor: 1, texto: "El puerto también era un riesgo"}
        fuente: [2, 6]
      - voz: "Para los afectados, cobrar llevó dieciséis años. Y muchos sienten que nadie respondió de verdad por lo que pasó."
        tipo: titulo
        texto: "Dieciséis años para cobrar"
        resaltar: "Dieciséis años"
        fuente: 6
      - voz: "Algo sí cambió. Tras el Prestige, Europa aceleró la retirada de los petroleros de un solo casco. Y abrió un debate que sigue vivo: si un barco herido debe tener derecho a un puerto de refugio."
        tipo: ilustracion
        escena: &doble_casco >-
          Lámina didáctica en corte de dos petroleros vistos de frente: el de la izquierda con una sola pared entre
          la carga negra y el mar; el de la derecha con dos paredes y un hueco vacío entre ambas. Estilo de libro
          de texto, colores suaves, sin texto.
        texto: "Adiós al casco único"
        fuente: 2

cierre:
  - voz: "El Prestige enseñó que alejar un problema no lo hace desaparecer. Solo lo reparte. Si te ha servido, en el canal tienes más historias del planeta explicadas con datos. Las fuentes están en la descripción."
    tipo: ilustracion
    escena: *playa_negra
    texto: "Bitácora de la Tierra"
    sub: "Fuentes en la descripción"
