# El radón: el gas radiactivo que puede haber en tu casa
# Canal de ciencias medioambientales · sección «Cómo funciona».
# Temario: Riesgos naturales, tema 9 (riesgos geoquímicos: radiactividad natural, radón).
# Cada dato lleva su fuente (lista «fuentes»). Las escenas que repiten exactamente la misma
# «escena» (marcadas con & y *) reutilizan la imagen: se paga una sola vez.

canal: medioambiente

descripcion: >-
  En 1984, un ingeniero hizo saltar la alarma de radiación de una central nuclear que todavía no tenía
  combustible. La radiactividad no venía de la central: venía de su casa. Era radón, un gas radiactivo
  natural que sale de las rocas, no se ve ni huele y se acumula en los bajos de los edificios. La OMS lo
  considera una de las principales causas de cáncer de pulmón. En este vídeo explicamos de dónde sale, por
  qué daña los pulmones, en qué zonas de España hay más, cómo se mide y cómo se reduce. Todos los datos,
  con su fuente.
hashtags: "#radón #salud #geología #vivienda #ciencia #España"

carpeta: "El radón"   # nombre de la carpeta en Google Drive
titulos:
  - "El gas radiactivo que puede haber en tu casa (y cómo saberlo)"
  - "Radón: por qué en Galicia y Madrid deberías medir tu casa"
  - "Una alarma nuclear sonó por culpa de su casa: el radón, explicado"

miniaturas:
  - texto: "El gas invisible de tu casa"
    resaltar: "invisible"
    cifra: "Radón"
    escena: &casa_corte >-
      Lámina didáctica en corte de una casa de dos plantas sobre el terreno: abajo, el suelo de granito con
      grietas; desde las grietas sube un gas representado con un sombreado violeta muy suave que entra por la
      solera y se acumula en el sótano y la planta baja; en el piso de arriba, una ventana abierta. Cielo claro.
  - texto: "¿Hay radón en tu zona?"
    resaltar: "tu zona"
    cifra: "17 %"
    lado: izquierda
    escena: &granito >-
      Un afloramiento de granito gris claro con grandes bolos redondeados y cristales visibles, en una sierra
      con pinos y jaras; al pie, un pueblo pequeño de casas de piedra con tejados de pizarra. Luz limpia de
      mañana.
  - texto: "La alarma era su casa"
    resaltar: "su casa"
    cifra: "1984"
    escena: &alarma >-
      La entrada de una central nuclear en construcción en los años ochenta: un arco detector de radiación con
      una luz roja encendida y, dentro del arco, una figura diminuta de tinta con casco y abrigo, sin rasgos;
      al fondo, las torres de refrigeración todavía con andamios. Luz gris de invierno.

