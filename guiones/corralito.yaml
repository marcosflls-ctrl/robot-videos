# El corralito (Argentina, 2001): el día que los argentinos no pudieron sacar su dinero del banco
# Canal de historia económica. Guion para revisar antes de montar.
# Cada dato lleva su fuente (lista «fuentes»). Las escenas que repiten exactamente la misma
# «escena» (marcadas con & y *) reutilizan la imagen: se paga una sola vez.
# Los políticos que salen se nombran, pero nunca se dibujan: las figuras son anónimas.

descripcion: >-
  El 3 de diciembre de 2001, millones de argentinos fueron a su banco y descubrieron que solo podían sacar
  250 pesos a la semana. Era el corralito. Diez años antes, el país había atado el peso al dólar para acabar
  con la hiperinflación, y funcionó. Pero el uno a uno tenía una trampa. Esta es la historia de cómo una
  moneda fuerte acabó en recesión, fuga de depósitos, cinco personas al frente del país en trece días, la
  suspensión de pagos de la deuda y unos ahorros en dólares convertidos a pesos por menos de la mitad de lo que valían.
hashtags: "#historia #economía #Argentina #corralito #2001 #convertibilidad"

carpeta: "El corralito (2001)"   # nombre de la carpeta en Google Drive
titulos:
  - "El corralito: el día que los argentinos no pudieron sacar su dinero (2001)"
  - "Solo 250 pesos a la semana: así se congelaron los ahorros de un país"
  - "Un peso, un dólar: la promesa que acabó en el corralito"

miniaturas:
  - texto: "No podían sacar su dinero"
    resaltar: "dinero"
    cifra: "250 $"
    escena: &cola_banco >-
      Una larga cola de figuras ante la puerta cerrada de un banco de Buenos Aires en diciembre de 2001: fachada
      clásica de piedra con rejas bajadas, gente de verano con bolsos y carpetas, algunos con cacerolas. Calor,
      luz dura de mediodía.
  - texto: "Un peso, un dólar"
    resaltar: "un dólar"
    cifra: "1991"
    lado: izquierda
    escena: &uno_a_uno >-
      Sobre un mostrador de casa de cambio de los años noventa, un billete de un peso argentino y un billete de un
      dólar colocados exactamente a la misma altura en una balanza de latón equilibrada. Fondo de madera oscura,
      luz cálida.
  - texto: "Ahorros convertidos a la mitad"
    resaltar: "la mitad"
    cifra: "1,40"
    escena: &libreta >-
      Una mano de figura dibujada a trazo sostiene una libreta de ahorro bancaria abierta frente a la ventanilla de un
      banco; detrás del cristal, un empleado se encoge de hombros. Luz de fluorescente, ambiente tenso.

