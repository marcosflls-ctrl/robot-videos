    short: true
    gancho_short:
      - voz: "En 2002, la economía argentina cayó casi un once por ciento. Más de la mitad del país quedó en la pobreza."
        tipo: titulo
        texto: "Más de la mitad, en la pobreza"
        resaltar: "la pobreza"
        kicker: "Historia económica"
        fuente: [3, 6]
    escenas:
      - voz: "El precio fue enorme. En 2002 la economía se hundió un diez coma nueve por ciento, según el INDEC."
