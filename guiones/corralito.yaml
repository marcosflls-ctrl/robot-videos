        valor: -10.9
        decimales: 1
        sufijo: " %"
        etiqueta: "Caída del PIB de Argentina en 2002"
        color: baja
        fuente: 6
      - voz: "El paro llegó al veintiuno por ciento y la pobreza, al cincuenta y siete coma cinco."
        tipo: comparar
        titulo: "Argentina en 2002"
        izquierda: {etiqueta: "Paro", valor: 21, texto: "21 %"}
        derecha: {etiqueta: "Pobreza", valor: 57.5, texto: "57,5 %"}
        fuente: 3
