# El paso Diátlov (Urales, 1959): nueve montañistas que salieron de su tienda en plena noche
# Canal de misterios · sección Misterios. Guion para revisar antes de montar.
# Cada dato lleva su fuente (lista «fuentes»). Las escenas que repiten exactamente la misma
# «escena» (marcadas con & y *) reutilizan la imagen: se paga una sola vez.
# Las víctimas fueron personas reales: se cuentan con respeto, sin detalles escabrosos, y los muñecos
# no se parecen a ninguna de ellas.

canal: misterios

descripcion: >-
  En febrero de 1959, nueve jóvenes montañistas soviéticos murieron en los montes Urales. Los rescatadores
  encontraron su tienda rajada desde dentro y a los primeros, a más de un kilómetro, casi sin ropa, a treinta
  grados bajo cero. Durante sesenta años se habló de pruebas militares, de ataques y hasta de extraterrestres.
  En 2020, la fiscalía rusa habló de una avalancha, y en 2021 dos científicos suizos explicaron cómo pudo
  ocurrir. Esta es la historia completa, lo que se sabe y lo que todavía no.
hashtags: "#Diatlov #misterio #Urales #1959 #avalancha #CasosATrazos"

carpeta: "El paso Diátlov (1959)"   # nombre de la carpeta en Google Drive
titulos:
  - "El paso Diátlov: nueve montañistas huyeron de su tienda en plena noche (1959)"
  - "Rajaron su tienda desde dentro a 30 bajo cero: qué pasó en el paso Diátlov"
  - "El misterio de los Urales que la ciencia empezó a resolver 60 años después"

miniaturas:
  - texto: "Huyeron en plena noche"
    resaltar: "noche"
    cifra: "1959"
    escena: &tienda_rajada >-
      Una tienda de campaña de lona de los años cincuenta, medio hundida por la nieve en una ladera pelada de
      montaña, con un corte largo y vertical en un costado por el que asoma la oscuridad del interior. Noche
      azul helada, viento levantando nieve. En primer plano, el presentador mira el corte con cara de asombro.
    gesto: "mira el corte de la tienda con los ojos muy abiertos"
  - texto: "Rajada desde dentro"
    resaltar: "dentro"
    cifra: "-30 °C"
    lado: izquierda
    escena: *tienda_rajada
    gesto: "señala el corte de la lona con cara de intriga"
  - texto: "¿Fue una avalancha?"
    resaltar: "avalancha"
    cifra: "2021"
    escena: &placa >-
      Una ladera nevada de montaña de noche: una placa de nieve compacta se desprende y se desliza unos metros
      hacia una tienda de campaña pequeña cavada en la pendiente. Cielo negro con estrellas, viento.
    gesto: "se lleva las manos a la cabeza al ver la nieve caer"

