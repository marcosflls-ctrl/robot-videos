# Fórum Filatélico y Afinsa: el timo de los sellos
# Guion para revisar. Cada dato lleva su fuente (lista de «fuentes» al final de este bloque).

titulo: "Fórum Filatélico y Afinsa: 350.000 ahorradores y unos sellos que no valían lo que pagaron"
descripcion: >-
  El 9 de mayo de 2006, la policía entró en Fórum Filatélico y Afinsa. Unos 350.000 españoles descubrieron
  esa mañana que sus ahorros eran sellos: sellos que valían una pequeña parte de lo que habían pagado.
  Esta es la historia del timo de los sellos: cómo funcionaba, los avisos que nadie atendió, las condenas
  y lo poco que recuperaron los afectados.
hashtags: "#historia #economía #estafa #Afinsa #FórumFilatélico #Ponzi #ahorro"

miniatura:
  texto: "Sus ahorros eran sellos"
  resaltar: "sellos"
  cifra: "350.000"

