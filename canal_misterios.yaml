# Identidad del canal de misterios, desastres y crímenes (estilo «muñeco de palo y acuarela»).
# Un guion usa este canal si lleva la línea:  canal: misterios
# Cambiar una línea aquí cambia todos los vídeos del canal.

# Nombre provisional: se cambia aquí cuando elijáis el definitivo.
marca: "CASOS A TRAZOS"
lema: "Misterios, desastres y crímenes reales"

# Voz de narrador (Gemini). Otras voces posibles: Charon, Sadaltager, Iapetus, Rasalgethi, Schedar.
voz: "Orus"
estilo_voz: >-
  Narrador de documental de misterio en español de España: voz grave y cercana, ritmo pausado,
  con suspense contenido y pausas antes de los datos importantes. Natural, sin dramatizar en exceso
  y sin sonar a anuncio.

# Colores (rojo, verde, azul de 0 a 255): aspecto de papel con tinta, distinto del canal de historia
colores:
  fondo: [236, 224, 200]       # papel (abajo del degradado)
  fondo2: [246, 238, 222]      # papel claro (arriba)
  panel: [225, 209, 180]       # cajas de los esquemas
  linea: [170, 148, 116]       # rejillas y bordes
  texto: [33, 27, 23]          # tinta
  suave: [104, 90, 74]         # textos secundarios
  acento: [176, 62, 42]        # rojo ladrillo: color principal del canal
  acento2: [168, 104, 22]      # ocre oscuro: lo que hay que mirar
  sombra_foto: [33, 27, 23]
  luz_foto: [246, 238, 222]
  sube: [70, 130, 70]
  baja: [176, 62, 42]

# Fuentes rotuladas a mano (carpeta fuentes/, licencia libre SIL OFL)
fuentes:
  tit: "GochiHand-Regular.ttf"      # titulares y rótulos
  tit2: "PatrickHand-Regular.ttf"   # citas
  txt: "PatrickHand-Regular.ttf"    # textos
  txt_b: "PatrickHand-Regular.ttf"  # etiquetas
  num: "GochiHand-Regular.ttf"      # cifras

# Ilustraciones con IA. El estilo se añade a todas para que parezcan de la misma mano.
# 1K cuesta un tercio menos que 2K y en este estilo de dibujo apenas se nota.
# Si dos escenas llevan exactamente la misma «escena», la imagen se paga una sola vez.
ilustraciones:
  modelo: "gemini-nano-banana-2.1"
  tamano: "1K"
  credito: "Ilustración"
  estilo: >-
    Ilustración dibujada a mano, como la viñeta de un libro ilustrado: línea de tinta negra de trazo
    irregular y algo tembloroso, coloreada con acuarela suave en tonos cálidos y terrosos (ocre, arena,
    terracota, marrón, verde oliva apagado y azules grisáceos), con textura de papel. Todas las personas
    son muñecos de palo muy sencillos: cabeza grande, redonda y blanca con contorno negro, dos ojos de
    punto con cejas muy expresivas y una boca simple; cuerpo, brazos y piernas de una sola línea negra fina,
    sin manos ni pies dibujados en detalle. Si la escena lo pide, llevan un único detalle de ropa muy simple
    (una gorra de piloto, un chaleco), sin rasgos que se parezcan a ninguna persona real. Los fondos, en
    cambio, son ricos y detallados: edificios, objetos y vehículos fieles a la época indicada.
    Aviones y vehículos sin logotipos ni nombres de compañías. Composición horizontal amplia, con aire,
    y el muñeco o el elemento principal fácil de ver de un vistazo. Tono serio pero amable: sin sangre,
    sin heridas, sin cuerpos, sin violencia explícita. Sin texto, sin letras, sin números, sin logotipos,
    sin marcas de agua.

# La miniatura se hace con la ilustración en color (no en dos tonos como en el canal de historia)
miniatura_color: true

# En los Shorts, las ilustraciones (horizontales) se ven enteras en el centro en vez de recortadas
ilustracion_vertical: encajar

subtitulos_largo: false
subtitulos_shorts: true

# Segundos de pantalla final del vídeo largo (YouTube pide entre 5 y 20 para poner otros vídeos)
pantalla_final: 12
