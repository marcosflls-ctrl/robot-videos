# Identidad del canal «Cuaderno de campo» (estilo «Herbario»).
# Todo lo que hace que el canal se reconozca está aquí: cambiar una línea cambia todos los vídeos.

# Nombre provisional: se cambia aquí cuando elijas el definitivo.
marca: "CUADERNO DE CAMPO"
lema: "Ciencias ambientales, explicadas con fuentes"

# Voz de narrador (Gemini). Otras voces posibles: Sadaltager, Iapetus, Orus, Rasalgethi, Schedar.
voz: "Charon"
estilo_voz: >-
  Narrador de documental de ciencias ambientales en español de España: voz clara y serena,
  ritmo pausado, entonación natural, sin titubeos y sin sonar a anuncio.

# Colores (rojo, verde, azul de 0 a 255)
colores:
  fondo: [17, 26, 20]          # verde casi negro
  fondo2: [28, 42, 32]         # verde bosque oscuro (arriba del degradado)
  panel: [36, 52, 41]          # cajas y países sin resaltar
  linea: [62, 84, 66]          # rejillas y bordes
  texto: [240, 234, 214]       # crema
  suave: [150, 165, 145]       # textos secundarios
  acento: [217, 119, 66]       # terracota: color principal del canal
  acento2: [233, 196, 106]     # ocre dorado: lo que hay que mirar
  sombra_foto: [18, 28, 21]    # fotos de época en dos tonos: sombras...
  luz_foto: [238, 229, 203]    # ...y luces
  sube: [134, 190, 120]
  baja: [217, 119, 66]

# Fuentes (carpeta fuentes/, todas con licencia libre SIL OFL)
fuentes:
  tit: "Fraunces-Black.ttf"         # titulares
  tit2: "Fraunces-SemiBold.ttf"     # citas y textos destacados
  txt: "SpaceGrotesk-Medium.ttf"    # textos
  txt_b: "SpaceGrotesk-Bold.ttf"    # etiquetas
  num: "Fraunces-Black.ttf"         # cifras

# Ilustraciones generadas con IA (escenas «ilustracion»). El estilo se añade a todas para que
# parezcan de la misma mano. Cada imagen cuesta unos céntimos y se guarda para no repetirla.
ilustraciones:
  modelo: "gemini-nano-banana-2.1"
  tamano: "2K"
  credito: "Ilustración"
  estilo: >-
    Ilustración editorial plana y elegante, estilo vectorial con textura de grano fino,
    como una lámina de cuaderno de naturalista. Paleta limitada: verde bosque oscuro, crema,
    terracota y algún toque de ocre dorado. Plantas, animales y paisajes dibujados con formas
    simples y limpias; figuras humanas estilizadas, sin rasgos faciales detallados, vistas a media
    distancia. Paisajes, especies y objetos fieles al lugar y la época indicados. Composición amplia
    y cinematográfica, con profundidad y luz suave. Sin texto, sin letras, sin números, sin logotipos,
    sin marcas de agua.

# Subtítulos grabados en el vídeo (en los Shorts casi siempre conviene; en el largo es opcional,
# porque de todas formas se genera el archivo .srt para subirlo a YouTube)
subtitulos_largo: false
subtitulos_shorts: true

# Segundos de pantalla final del vídeo largo (YouTube pide entre 5 y 20 para poner otros vídeos)
pantalla_final: 12
