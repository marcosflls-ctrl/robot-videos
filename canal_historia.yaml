# Identidad del canal de historia económica (estilo «Editorial»).
# Todo lo que hace que el canal se reconozca está aquí: cambiar una línea cambia todos los vídeos.

# Nombre provisional: se cambia aquí cuando elijas el definitivo.
marca: "EL PRECIO DE LA HISTORIA"
lema: "Historia económica, con datos"

# Voz de narrador (Gemini). Otras voces posibles: Sadaltager, Iapetus, Orus, Rasalgethi, Schedar.
voz: "Charon"
estilo_voz: >-
  Narrador de documental de historia económica en español de España: voz clara y serena,
  ritmo pausado, entonación natural, sin titubeos y sin sonar a anuncio.

# Colores (rojo, verde, azul de 0 a 255)
colores:
  fondo: [21, 18, 15]          # negro cálido
  fondo2: [36, 30, 24]         # marrón muy oscuro (arriba del degradado)
  panel: [44, 37, 30]          # cajas y países sin resaltar
  linea: [70, 60, 49]          # rejillas y bordes
  texto: [242, 234, 219]       # crema
  suave: [168, 156, 138]       # textos secundarios
  acento: [228, 87, 46]        # rojo anaranjado: color principal del canal
  acento2: [242, 177, 52]      # dorado: lo que hay que mirar
  sombra_foto: [24, 19, 15]    # fotos de época en dos tonos: sombras...
  luz_foto: [245, 230, 205]    # ...y luces
  sube: [126, 186, 110]
  baja: [228, 87, 46]

# Fuentes (carpeta fuentes/, todas con licencia libre SIL OFL)
fuentes:
  tit: "Fraunces-Black.ttf"         # titulares
  tit2: "Fraunces-SemiBold.ttf"     # citas y textos destacados
  txt: "SpaceGrotesk-Medium.ttf"    # textos
  txt_b: "SpaceGrotesk-Bold.ttf"    # etiquetas
  num: "Fraunces-Black.ttf"         # cifras

# Ilustraciones generadas con IA (escenas «ilustracion»). El estilo se añade a todas para que
# parezcan de la misma mano. Cada imagen cuesta unos céntimos y se guarda para no repetirla.
ilustraciones:
  modelo: "gemini-nano-banana-2.1"
  # 1K cuesta un tercio menos que 2K y en este estilo de dibujo apenas se nota.
  # (Los vídeos ya hechos a 2K, si se relanzan, volverían a pedir sus ilustraciones.)
  tamano: "1K"
  credito: "Ilustración"
  estilo: >-
    Ilustración editorial que mezcla dos técnicas. Los fondos (edificios, calles, interiores, máquinas,
    barcos y objetos) son planos y elegantes, estilo vectorial con sombras suaves y textura de grano fino,
    como un cartel de museo moderno, y fieles a la época indicada. Las personas, en cambio, están dibujadas
    a trazo: figuras de línea de tinta negra, algo suelta y viva, como un boceto a pluma, rellenas de un
    único color plano crema o arena; cabeza ovalada sin rasgos faciales y cuerpo con proporciones
    naturales, que se expresan con la postura y los gestos. Cada figura lleva un detalle de ropa de su época
    dibujado con pocas líneas (una chistera, un delantal, un mandil de obrero, un sombrero de ala), sin
    parecerse a ninguna persona real. Paleta limitada y cálida: negro tostado, crema, arena, terracota y
    algún toque dorado apagado. Composición amplia y cinematográfica, con profundidad, luz suave y las
    figuras fáciles de ver de un vistazo. Sin texto, sin letras, sin números, sin logotipos, sin marcas de
    agua.

# La miniatura se hace con la ilustración en color (antes, en dos tonos)
miniatura_color: true

# En los Shorts, las ilustraciones (horizontales) se ven enteras en el centro en vez de recortadas
ilustracion_vertical: encajar

# Subtítulos grabados en el vídeo (en los Shorts casi siempre conviene; en el largo es opcional,
# porque de todas formas se genera el archivo .srt para subirlo a YouTube)
subtitulos_largo: false
subtitulos_shorts: true

# Segundos de pantalla final del vídeo largo (YouTube pide entre 5 y 20 para poner otros vídeos)
pantalla_final: 12
