preguntas:
- pregunta: ¿Cuál era el dios del sol en el antiguo Egipto?
  opciones:
  - Ra
  - Anubis
  - Osiris
  - Set
  correcta: A
  dato: Lo imaginaban cruzando el cielo cada día en una barca.
  escena: Una barca dorada egipcia navegando por un cielo de atardecer con un gran disco solar encima
- pregunta: ¿Qué dios egipcio tenía cabeza de chacal?
  opciones:
  - Horus
  - Anubis
  - Thot
  - Sobek
  correcta: B
  dato: Era el dios de los muertos y de la momificación.
  escena: Una estatua de un dios egipcio con cabeza de chacal negro y oro en una tumba iluminada por antorchas
- tipo: vf
