# Vídeos de prueba de las tres webs: Zona Leonida, Al Final de Mes y Dinero en Claro.
# Lee los datos de las dos webs (solo lectura), monta los vídeos con tu voz
# te los manda por Telegram y los sube a YouTube EN PRIVADO (no publica nada ni toca las webs).
# Se lanza solo cada mañana; también a mano: pestaña "Actions" -> "Vídeos de las tres webs" -> "Run workflow".

name: Vídeos de las tres webs

on:
  # Cada día a las 3:13 UTC (4:13 en Madrid en horario de invierno, 5:13 en verano).
  # GitHub suele retrasar las tareas programadas varias horas cuando va cargado: por eso se programa
  # de madrugada, para que los vídeos lleguen igualmente por la mañana.
  # Las ejecuciones programadas usan las opciones por defecto: las tres webs, Gemini, tu voz clonada.
  schedule:
    - cron: "13 3 * * *"
  workflow_dispatch:
    inputs:
      motor_voz:
        description: "Motor de voz: gemini (Google, más natural y rápido) o chatterbox (en GitHub)"
        type: choice
        options: ["gemini", "chatterbox"]
        default: "gemini"
      voz_gemini:
        description: "Voz de Gemini (Orus es la de siempre)"
        type: choice
        options: ["Orus", "Charon", "Puck", "Fenrir", "Sadaltager", "Iapetus", "Kore", "Aoede"]
        default: "Orus"
      voz:
        description: "Estilo de voz: natural (pausas en las comas), expresivo (más entonación) o antes (como la primera prueba)"
        type: choice
        options: ["natural", "expresivo", "antes"]
        default: "natural"
      montaje:
        description: "Montaje: escenas (cortes rápidos y clips de Pexels) o clasico (una sola pantalla)"
        type: choice
        options: ["escenas", "clasico"]
        default: "escenas"
      webs:
        description: "Qué webs (gta = Zona Leonida, afdm = Al Final de Mes, dec = Dinero en Claro)"
        type: choice
        options: ["las tres", "gta", "afdm", "dec", "afdm,dec"]
        default: "las tres"
      tema_afdm:
        description: "Al Final de Mes: tema (vacío = el que toca hoy)"
        type: choice
        options: ["", "luz", "carburantes", "ipc", "euribor"]
        default: ""
      tema_dec:
        description: "Dinero en Claro: tema (vacío = el que toca hoy)"
        type: choice
        options: ["", "mercados", "aportaciones", "ahorro", "cripto"]
        default: ""
      subir_youtube:
        description: "Subir también a YouTube (siempre en privado)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar la clave de lectura de datos
        id: datos
        env:
          DATOS_TOKEN: ${{ secrets.DATOS_TOKEN }}
          WEBS: ${{ github.event.inputs.webs }}
        run: |
          if [ "$WEBS" = "gta" ]; then
            echo "leer=no" >> "$GITHUB_OUTPUT"
          else
            echo "leer=si" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$DATOS_TOKEN" ]; then
            echo "::error::Falta la clave DATOS_TOKEN (lectura de los datos de las webs). Mira el README."
            exit 1
          fi
      - name: Traer la voz y las imágenes (repositorio privado)
        uses: actions/checkout@v4
        with:
          repository: marcosflls-ctrl/videos-cortos
          token: ${{ secrets.DATOS_TOKEN }}
          path: privado
          sparse-checkout: |
            voz_referencia.wav
            imagenes_gta
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Leer datos de Al Final de Mes
        if: steps.datos.outputs.leer == 'si'
        uses: actions/checkout@v4
        with:
          repository: marcosflls-ctrl/al-final-de-mes
          token: ${{ secrets.DATOS_TOKEN }}
          path: datos/afdm
          sparse-checkout: src/data
          persist-credentials: false
      - name: Leer datos de Dinero en Claro
        if: steps.datos.outputs.leer == 'si'
        uses: actions/checkout@v4
        with:
          repository: marcosflls-ctrl/dinero-en-claro
          token: ${{ secrets.DATOS_TOKEN }}
          path: datos/dec
          sparse-checkout: src/data
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar programas del sistema
        timeout-minutes: 5
        # ffmpeg ya hecho (sin apt-get, que a veces se queda colgado en GitHub)
        run: |
          if ! which ffmpeg; then
            pip install --quiet imageio-ffmpeg
            sudo ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg
          fi
          ffmpeg -hide_banner -version | head -1
      - name: Instalar librerías básicas
        run: pip install --quiet numpy soundfile num2words pillow
      - name: Instalar Chatterbox (versión sin tarjeta gráfica)
        if: github.event.inputs.motor_voz == 'chatterbox'
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: pip install --quiet "chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox@5de7a54aa4e5e2baadb0182dde554908b48b85c2" soundfile num2words pillow
      - name: Montar los vídeos
        env:
          WEBS: ${{ (github.event.inputs.webs == 'las tres' || github.event.inputs.webs == '') && 'gta,afdm,dec' || github.event.inputs.webs }}
          VOZ: ${{ github.event.inputs.voz }}
          VOZ_MOTOR: ${{ github.event.inputs.motor_voz }}
          GEMINI_VOZ: ${{ github.event.inputs.voz_gemini }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_VOICE_ID: ${{ secrets.GEMINI_VOICE_ID }}
          MONTAJE: ${{ github.event.inputs.montaje }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TEMA_AFDM: ${{ github.event.inputs.tema_afdm }}
          TEMA_DEC: ${{ github.event.inputs.tema_dec }}
          DATOS_AFDM: ${{ github.workspace }}/datos/afdm/src/data
          DATOS_DEC: ${{ github.workspace }}/datos/dec/src/data
        working-directory: scripts
        run: python video_webs.py
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: videos-webs
          path: |
            scripts/salida/*.mp4
            scripts/salida/*.txt
      - name: Mandar los vídeos por Telegram (si está configurado)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram no está configurado: descarga los vídeos en el apartado 'Artifacts' de esta ejecución."
            exit 0
          fi
          shopt -s nullglob
          for v in scripts/salida/*.mp4; do
            respuesta=$(curl -s -F chat_id="$TELEGRAM_CHAT_ID" -F video=@"$v" \
              -F supports_streaming=true -F caption="$(head -c 1000 "${v%.mp4}.txt")" \
              "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendVideo")
            if echo "$respuesta" | grep -q '"ok":true'; then
              echo "Enviado: $v"
            else
              echo "::error::Telegram no aceptó $v: $(echo "$respuesta" | cut -c1-200)"
            fi
          done
      - name: Subir a YouTube en privado (si está configurado)
        if: github.event.inputs.subir_youtube != 'false'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_GTA: ${{ secrets.YOUTUBE_REFRESH_GTA }}
          YOUTUBE_REFRESH_AFDM: ${{ secrets.YOUTUBE_REFRESH_AFDM }}
          YOUTUBE_REFRESH_DEC: ${{ secrets.YOUTUBE_REFRESH_DEC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        working-directory: scripts
        run: python subir_youtube.py
