# TEMPORAL: prueba del robot de GTA con el motor nuevo, sin voz. El vídeo va solo a Telegram;
# aquí solo se guarda el registro y el guion (texto), nunca imágenes del repositorio privado.
name: Prueba sellos (temporal)
on:
  push:
    branches: ["prueba-sellos"]
permissions:
  contents: write
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: motor-remotion
          path: motor
      - name: Fotogramas (repositorio privado)
        uses: actions/checkout@v4
        with:
          repository: marcosflls-ctrl/videos-cortos
          token: ${{ secrets.DATOS_TOKEN }}
          path: motor/privado
          sparse-checkout: |
            imagenes_gta
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          pip install --quiet numpy soundfile num2words pillow pyyaml
          cd motor/remotion && npm ci --no-audit --no-fund
      - name: Montar (sin voz)
        env:
          MODO: auto
          SIN_VOZ: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VENTANA_HORAS: "200"
        working-directory: motor/scripts
        run: python video_lienzo.py 2>&1 | tee ../../registro.txt; exit ${PIPESTATUS[0]}
      - name: Mandar por Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for v in motor/scripts/salida/*.mp4; do
            curl -s -F chat_id="$TELEGRAM_CHAT_ID" -F video=@"$v" -F supports_streaming=true \
              -F caption="Prueba del motor nuevo (sin voz). $(head -c 600 "${v%.mp4}.txt")" "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendVideo" | cut -c1-100
          done
      - name: Guardar registro y guion (solo texto)
        if: always()
        run: |
          mkdir -p resultado && rm -f resultado/*
          cp registro.txt resultado/ 2>/dev/null || true
          cp motor/scripts/salida/*.json motor/scripts/salida/*.txt resultado/ 2>/dev/null || true
          ls -la motor/scripts/salida/ > resultado/salida.txt 2>&1 || true
          git config user.name "robot" && git config user.email "robot@users.noreply.github.com"
          git add -f resultado && git commit -qm "Resultado de la prueba" && git push -q origin HEAD:prueba-sellos
