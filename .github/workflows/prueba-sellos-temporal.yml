# TEMPORAL: prueba del corte por frases de la voz (se borra al acabar).
name: Prueba sellos (temporal)
on:
  push:
    branches: ["prueba-sellos"]
permissions:
  contents: write
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get install -y -qq espeak-ng >/dev/null
      - run: pip install --quiet numpy soundfile num2words pyyaml faster-whisper
      - name: Probar el corte
        working-directory: scripts
        run: |
          mkdir -p salida
          echo "== base" | tee salida/registro.txt
          python prueba_tandas.py 2>&1 | grep -v Warning | tee -a salida/registro.txt
          echo "== otra semilla" | tee -a salida/registro.txt
          SEMILLA=7 python prueba_tandas.py 2>&1 | grep -v Warning | tee -a salida/registro.txt

      - name: Guardar el resultado en la rama de prueba
        if: always()
        run: |
          mkdir -p resultado
          cp scripts/salida/registro.txt resultado/ 2>/dev/null || true
          git config user.name "robot" && git config user.email "robot@users.noreply.github.com"
          git add -f resultado && git commit -qm "Resultado de la prueba" && git push -q origin HEAD:prueba-sellos
