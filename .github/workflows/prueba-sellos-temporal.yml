# TEMPORAL: monta las dos demos del motor Remotion (rama motor-remotion). Se borra al acabar.
name: Prueba sellos (temporal)
on:
  push:
    branches: ["prueba-sellos"]
permissions:
  contents: write
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        demo: [demo_a, demo_b]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: motor-remotion
          path: motor
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Montar ${{ matrix.demo }}
        working-directory: motor/remotion
        run: |
          npm ci --no-audit --no-fund
          mkdir -p out
          node render.mjs demos/${{ matrix.demo }}.json out/${{ matrix.demo }}.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.demo }}
          path: motor/remotion/out/${{ matrix.demo }}.mp4
  guardar:
    needs: prueba
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: descargas
      - run: |
          mkdir -p resultado && rm -f resultado/*
          cp descargas/*/*.mp4 resultado/
          git config user.name "robot" && git config user.email "robot@users.noreply.github.com"
          git add -f resultado && git commit -qm "Resultado de la prueba" && git push -q origin HEAD:prueba-sellos
