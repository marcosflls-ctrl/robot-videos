# Zona Leonida con el MOTOR NUEVO (Remotion): un director (IA) inventa el montaje de cada vídeo.
# De momento es una prueba aparte: te manda el vídeo por Telegram y NO publica nada.
# El robot diario de siempre sigue igual hasta que decidas cambiarlo.
# Se lanza a mano: pestaña "Actions" -> "Vídeo GTA (motor nuevo)" -> "Run workflow".

name: Vídeo GTA (motor nuevo)

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Qué vídeo: auto (noticia si hay una nueva; si no, cuenta atrás), cuenta o articulo"
        type: choice
        options: ["auto", "cuenta", "articulo"]
        default: "auto"
      voz_gemini:
        description: "Voz de Gemini"
        type: choice
        options: ["Orus", "Charon", "Puck", "Fenrir", "Sadaltager", "Iapetus", "Kore", "Aoede"]
        default: "Orus"
      sin_voz:
        description: "Prueba rápida sin voz (no gasta cupo de voz)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Traer los fotogramas del tráiler (repositorio privado)
        uses: actions/checkout@v4
        with:
          repository: marcosflls-ctrl/videos-cortos
          token: ${{ secrets.DATOS_TOKEN }}
          path: privado
          sparse-checkout: |
            imagenes_gta
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar programas
        run: |
          if ! which ffmpeg; then
            pip install --quiet imageio-ffmpeg
            sudo ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg
          fi
          pip install --quiet numpy soundfile num2words pillow pyyaml faster-whisper
          cd remotion && npm ci --no-audit --no-fund
      # Memoria del director (para no repetir montajes) y descripciones de los fotogramas
      - name: Recuperar la memoria del director
        uses: actions/cache/restore@v4
        with:
          path: cache_director
          key: director-${{ github.run_id }}
          restore-keys: director-
      - name: Recuperar el reconocedor de voz
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base
      - name: Montar el vídeo
        env:
          MODO: ${{ github.event.inputs.modo }}
          SIN_VOZ: ${{ github.event.inputs.sin_voz == 'true' && '1' || '' }}
          VOZ_MOTOR: gemini
          GEMINI_VOZ: ${{ github.event.inputs.voz_gemini }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VENTANA_HORAS: "30"
        working-directory: scripts
        run: python video_lienzo.py
      - name: Guardar la memoria del director
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache_director
          key: director-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 3
          name: video-gta-motor-nuevo
          path: |
            scripts/salida/*.mp4
            scripts/salida/*.txt
            scripts/salida/*.json
      - name: Mandar el vídeo por Telegram (si está configurado)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram no está configurado: descarga el vídeo en el apartado 'Artifacts' de esta ejecución."
            exit 0
          fi
          shopt -s nullglob
          for v in scripts/salida/*.mp4; do
            respuesta=$(curl -s -F chat_id="$TELEGRAM_CHAT_ID" -F video=@"$v" -F supports_streaming=true \
              -F caption="$(head -c 1000 "${v%.mp4}.txt")" "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendVideo")
            if echo "$respuesta" | grep -q '"ok":true'; then echo "Enviado: $v"; else echo "::warning::Telegram no aceptó $v: $(echo "$respuesta" | cut -c1-200)"; fi
          done
