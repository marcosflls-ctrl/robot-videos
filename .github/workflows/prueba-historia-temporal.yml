# TEMPORAL: prueba del montaje de historia sin voz (se borra antes de aceptar la propuesta).
name: Prueba historia (temporal)
on:
  push:
    branches: ["prueba-historia-editorial"]
permissions:
  contents: write
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: pip install --quiet numpy soundfile num2words pillow pyyaml scikit-image
      - name: Buscar candidatas en Commons
        env:
          BUSQUEDAS: "Edificio Telefónica Gran Vía Madrid;Juan Villalonga;Palacio de la Bolsa de Madrid;Bolsa de Madrid interior;Nasdaq MarketSite Times Square;Distrito Telefónica Las Tablas;César Alierta;dial-up modem;iMac G3;Internet cafe 2000;stock market crash newspaper;New York Stock Exchange trading floor 1990s"
        working-directory: scripts
        run: mkdir -p salida; python buscar_imagenes.py 2>&1 | tee salida/registro.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prueba
          retention-days: 2
          path: |
            scripts/salida/*_largo_movil.mp4
            scripts/salida/*_short_*.mp4
            scripts/salida/*.txt
            scripts/salida/*.png
      - name: Guardar el resultado en la rama de prueba
        if: always()
        run: |
          mkdir -p resultado
          cp cache_imagenes/ia_*.jpg resultado/ 2>/dev/null || true
          cp scripts/salida/registro.txt scripts/salida/*.txt scripts/salida/*.png scripts/salida/*_largo_movil.mp4 scripts/salida/*_short_*.mp4 resultado/ 2>/dev/null || true
          git config user.name "robot" && git config user.email "robot@users.noreply.github.com"
          git add -f resultado && git commit -qm "Resultado de la prueba" && git push -q origin HEAD:prueba-historia-editorial
