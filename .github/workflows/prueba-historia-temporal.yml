# TEMPORAL: prueba del montaje de historia sin voz (se borra antes de aceptar la propuesta).
name: Prueba historia (temporal)
on:
  push:
    branches: ["prueba-historia-editorial"]
permissions:
  contents: read
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: pip install --quiet numpy soundfile num2words pillow pyyaml scikit-image
      - name: Montar sin voz
        env:
          GUION: ejemplo
          QUE: todo
          SIN_VOZ: "1"
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        working-directory: scripts
        run: python historia.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prueba
          retention-days: 2
          path: |
            scripts/salida/*_largo_movil.mp4
            scripts/salida/*_short_*.mp4
            scripts/salida/*.txt
            scripts/salida/*.png
