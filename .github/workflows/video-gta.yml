# Vídeo de prueba de Zona Leonida: «Faltan X días para GTA 6».
# Lo monta con tu voz y te lo manda por Telegram para revisarlo. NO publica nada.
# Se lanza a mano: pestaña "Actions" -> "Vídeo GTA (prueba)" -> "Run workflow".

name: Vídeo GTA (prueba)

on:
  workflow_dispatch:
    inputs:
      motor_voz:
        description: "Motor de voz: gemini (Google, más natural y rápido) o chatterbox (en GitHub)"
        type: choice
        options: ["gemini", "chatterbox"]
        default: "gemini"
      voz_gemini:
        description: "Voz de Gemini (Orus es la de siempre)"
        type: choice
        options: ["Orus", "Charon", "Puck", "Fenrir", "Sadaltager", "Iapetus", "Kore", "Aoede"]
        default: "Orus"
      voz:
        description: "Estilo de voz: natural (pausas en las comas), expresivo (más entonación) o antes (como la primera prueba)"
        type: choice
        options: ["natural", "expresivo", "antes"]
        default: "natural"
      montaje:
        description: "Montaje: escenas (cortes rápidos y clips de Pexels) o clasico (una sola pantalla)"
        type: choice
        options: ["escenas", "clasico"]
        default: "escenas"
      dias:
        description: "Días que faltan (déjalo vacío para usar la fecha de hoy)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Traer la voz y las imágenes (repositorio privado)
        uses: actions/checkout@v4
        with:
          repository: marcosflls-ctrl/videos-cortos
          token: ${{ secrets.DATOS_TOKEN }}
          path: privado
          sparse-checkout: |
            voz_referencia.wav
            imagenes_gta
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar programas del sistema
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Instalar librerías básicas
        run: pip install --quiet numpy soundfile num2words pillow
      - name: Instalar Chatterbox (versión sin tarjeta gráfica)
        if: github.event.inputs.motor_voz == 'chatterbox'
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: pip install --quiet "chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox@5de7a54aa4e5e2baadb0182dde554908b48b85c2" soundfile num2words pillow
      - name: Montar el vídeo
        env:
          DIAS: ${{ github.event.inputs.dias }}
          VOZ: ${{ github.event.inputs.voz }}
          VOZ_MOTOR: ${{ github.event.inputs.motor_voz }}
          GEMINI_VOZ: ${{ github.event.inputs.voz_gemini }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_VOICE_ID: ${{ secrets.GEMINI_VOICE_ID }}
          MONTAJE: ${{ github.event.inputs.montaje }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        working-directory: scripts
        run: python video_gta.py
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: video-gta
          path: |
            scripts/salida/*.mp4
            scripts/salida/*.txt
      - name: Mandar el vídeo por Telegram (si está configurado)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram no está configurado: descarga el vídeo en el apartado 'Artifacts' de esta ejecución."
            exit 0
          fi
          shopt -s nullglob
          for v in scripts/salida/*.mp4; do
            texto="${v%.mp4}.txt"
            respuesta=$(curl -s -F chat_id="$TELEGRAM_CHAT_ID" -F video=@"$v" \
              -F supports_streaming=true -F caption="$(head -c 1000 "$texto")" \
              "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendVideo")
            if echo "$respuesta" | grep -q '"ok":true'; then
              echo "Enviado: $v"
            else
              echo "::error::Telegram no aceptó el vídeo: $(echo "$respuesta" | sed 's/"description"/\n&/' | tail -1 | cut -c1-200)"
              exit 1
            fi
          done
